name: Site

# Build apassy.wyderka.cc (site/) on each change of the site or of a file that it
# builds from or checks against (the installer, the version, the changelog, the
# screenshots, the plans and their prices). On
# main, deploy the Worker and its assets only for a released version. The disk image comes from
# release.yml.
# See docs/operations/release.md.

on:
  push:
    paths: ["site/**", "scripts/install.sh", "scripts/check-site-plans.py", "docs/product/plans.md", "tests/fixtures/connect-billing-v1/**", "Cargo.toml", "CHANGELOG.md", "docs/images/**", ".github/workflows/site.yml"]
  pull_request:
    paths: ["site/**", "scripts/install.sh", "scripts/check-site-plans.py", "docs/product/plans.md", "tests/fixtures/connect-billing-v1/**", "Cargo.toml", "CHANGELOG.md", "docs/images/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site
    env:
      HAS_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Check publication eligibility
        id: ready
        run: >-
          python3 ../scripts/ci-release-ready.py --cargo ../Cargo.toml
          --changelog ../CHANGELOG.md --github-output "$GITHUB_OUTPUT"

      # A dated changelog section alone can still name an already released version.
      # Fetch all tags above and refuse to deploy changed assets under that version.
      - name: Require a new coordinated release version
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.ready.outputs.production == 'true'
        run: python3 ../scripts/check-release-versions.py --release

      - name: Check the prices of the site against the plans
        run: python3 ../scripts/check-site-plans.py

      - name: Install Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check the Worker types
        run: npm run check

      - name: Build the site
        run: npm run build

      - name: Hold publication of an unreleased version
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.ready.outputs.production != 'true'
        run: echo "::notice::Publication is held because the version is not released. The existing site stays unchanged."

      - name: Say why the deploy is skipped
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.ready.outputs.production == 'true' && env.HAS_CLOUDFLARE_TOKEN != 'true'
        run: echo "::warning::CLOUDFLARE_API_TOKEN is not set, so the site is not deployed. See docs/operations/release.md."

      - name: Deploy to Cloudflare
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.ready.outputs.production == 'true' && env.HAS_CLOUDFLARE_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # The Worker binds the bucket. Make it on the first deploy.
          npx wrangler r2 bucket info apassy-downloads >/dev/null 2>&1 \
            || npx wrangler r2 bucket create apassy-downloads
          npx wrangler deploy
