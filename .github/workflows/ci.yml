name: CI

# One run for each update of a pull request, and one for each push to main. A push
# to another branch or a tag runs nothing: its pull request or main runs the same
# code. The site has its own workflow, and design/ is not part of the app.
# A draft pull request skips the macOS test groups and the release build, so that
# work in progress does not hold the five macOS runners. Marking it ready for review
# runs the full suite; only that run can be reused on main.
on:
  workflow_dispatch:
    inputs:
      context_experiment:
        description: Optional supervised bouncer experiment
        type: choice
        options:
          - off
          - probe
          - full
          - cost-only
          - cuda-preflight
          - external-evaluate
          - development-diagnostic
        default: off
        required: true
      source_sha:
        description: Exact lowercase source commit SHA (cost-only)
        type: string
        required: false
      checkpoint_asset:
        description: Draft release ID/asset ID in wydrox/apassy (cost-only)
        type: string
        required: false
      checkpoint_sha256:
        description: External checkpoint SHA-256 (cost-only)
        type: string
        required: false
      transport_only:
        description: Check draft asset transport only; no models or benchmark (cost-only)
        type: boolean
        default: false
        required: false
      val_sha256:
        description: External Mac freeze validation SHA-256 (cost-only)
        type: string
        required: false
      groups:
        description: G1 groups 400..800; seed fixed at 7 (cost-only)
        type: string
        required: false
        default: '400'
      run_id:
        description: Attested external run ID
        type: string
        required: false
      bundle_asset:
        description: Draft release ID/asset ID for external bundle
        type: string
        required: false
      bundle_sha256:
        description: External bundle SHA-256
        type: string
        required: false
      freeze_sha256:
        description: External freeze SHA-256
        type: string
        required: false
      shipped_baseline:
        description: Require optional pinned shipped baseline evidence
        type: boolean
        default: false
        required: false
  push:
    branches: [main]
    paths-ignore:
      - "site/**"
      - "design/**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "site/**"
      - "design/**"

permissions:
  contents: read

# A newer pull request commit cancels its older run. Main runs finish in order
# of completion; Release checks the current main commit before publication.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  context-experiment:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.context_experiment == 'probe' || inputs.context_experiment == 'full' || inputs.context_experiment == 'cost-only' || inputs.context_experiment == 'cuda-preflight' || inputs.context_experiment == 'external-evaluate' || inputs.context_experiment == 'development-diagnostic') }}
    permissions:
      contents: read
    uses: ./.github/workflows/bouncer-context-experiment.yml
    with:
      mode: ${{ inputs.context_experiment }}
      source_sha: ${{ inputs.source_sha }}
      checkpoint_asset: ${{ inputs.checkpoint_asset }}
      checkpoint_sha256: ${{ inputs.checkpoint_sha256 }}
      transport_only: ${{ inputs.transport_only }}
      val_sha256: ${{ inputs.val_sha256 }}
      groups: ${{ inputs.groups }}
      run_id: ${{ inputs.run_id }}
      bundle_asset: ${{ inputs.bundle_asset }}
      bundle_sha256: ${{ inputs.bundle_sha256 }}
      freeze_sha256: ${{ inputs.freeze_sha256 }}
      shipped_baseline: ${{ inputs.shipped_baseline }}
    secrets:
      APASSY_CONTEXT_INPUT: ${{ secrets.APASSY_CONTEXT_INPUT }}
      APASSY_CONTEXT_SHIPPED_HEADS_URL: ${{ secrets.APASSY_CONTEXT_SHIPPED_HEADS_URL }}

  reuse-pr:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      reuse: ${{ (inputs.context_experiment == 'development-diagnostic' || inputs.context_experiment == 'cuda-preflight') && 'true' || steps.select.outputs.reuse }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Look up green PR evidence (errors run the full suite)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: select
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci-reuse-pr.py select
      # A draft run skips the macOS tests, so it records no evidence for main.
      - name: Record the actual synthetic merge tree
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
        run: python3 scripts/ci-reuse-pr.py record --record "$RUNNER_TEMP/tested-tree.json"
      - name: Save PR tree evidence
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-tested-tree-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tested-tree.json
          if-no-files-found: error
          retention-days: 7

  extension:
    needs: reuse-pr
    if: always() && !cancelled() && needs.reuse-pr.outputs.reuse != 'true'
    runs-on: ${{ vars.APASSY_MACOS_INTEL_FALLBACK == 'true' && 'macos-15-intel' || 'macos-15' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install pinned Helium for synthetic extension tests
        shell: bash
        run: |
          case "$(uname -m)" in
            arm64) arch=arm64; sha=f9b2f312ebbaa9be09fc59a5de9191404dc008f1502434a6f319af2a4dccbac5 ;;
            x86_64) arch=x86_64; sha=b2f7d2a8cd066c18e5d6f42d30227d77e7b39d1dc5e146fc0b09a3f225ecdadd ;;
            *) exit 1 ;;
          esac
          image="$RUNNER_TEMP/helium.dmg"
          mount="$RUNNER_TEMP/helium-volume"
          curl --fail --location --retry 3 "https://github.com/imputnet/helium-macos/releases/download/0.20.3.1/helium_0.20.3.1_${arch}-macos.dmg" -o "$image"
          printf '%s  %s\n' "$sha" "$image" | shasum -a 256 -c -
          hdiutil attach "$image" -nobrowse -readonly -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          ditto "$mount/Helium.app" /Applications/Helium.app
      - name: Install Node test dependencies
        working-directory: extension-tests
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run extension Node models
        working-directory: extension-tests
        run: node --test fixtures/login-journey/*.unit.mjs fixtures/passkey-bridge/*.unit.mjs fixtures/passkey-rp/unit-checks.mjs
      - name: Run extension Playwright tests in isolated Helium profiles
        working-directory: extension-tests
        run: npm test

  macos:
    needs: reuse-pr
    if: always() && !cancelled() && needs.reuse-pr.outputs.reuse != 'true'
    runs-on: ${{ vars.APASSY_MACOS_INTEL_FALLBACK == 'true' && 'macos-15-intel' || 'macos-15' }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.97.0
        run: rustup toolchain install 1.97.0 --profile minimal --component rustfmt --component clippy

      # The action keys dependencies by OS, architecture, compiler, lockfile,
      # and Cargo configuration. PRs can restore caches but cannot save them.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: dev-quality
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Fetch Cargo dependencies
        run: cargo fetch --locked

      - name: Check the browser extension version
        run: |
          app_version="$(awk -F'"' '/^version = / {print $2; exit}' Cargo.toml)"
          extension_version="$(plutil -extract version raw -o - extension/manifest.json)"
          if [ "$app_version" != "$extension_version" ]; then
            echo "::error::The browser extension version must match Cargo.toml."
            exit 1
          fi

      - name: Check Rust format
        run: cargo fmt --all -- --check

      - name: Typecheck the native session and Keychain helper
        run: xcrun --sdk macosx swiftc -typecheck -swift-version 5 -warnings-as-errors native/ApassyHelper/*.swift

      - name: Run Clippy
        run: cargo clippy --offline --locked --all-features --all-targets -- -D warnings

      # The demo app builds without the vault feature. The steps above build only
      # with all features, so they do not see vault code that is not gated.
      - name: Check the demo build without the vault
        run: cargo check --offline --locked --features desktop --bin apassy

      # The app binary (crates/apassy-app) is outside the default members: it joins the
      # core with the relay crate for the Mac's own node (ADR 0037).
      - name: Run Clippy on the app crate
        run: cargo clippy --offline --locked -p apassy-app --all-targets -- -D warnings

      - name: Check vault API compile failures
        run: cargo test --offline --locked --features vault --doc

      # The Apple Watch slices of the vault core (ADR 0039 section 4) build without the
      # default `openssl` feature: SQLCipher uses CommonCrypto there and nowhere else.
      - name: Check the Apple Watch vault core
        run: |
          rustup target add --toolchain 1.97.0 aarch64-apple-watchos aarch64-apple-watchos-sim
          cargo check --offline --locked -p apassy-core --no-default-features --target aarch64-apple-watchos-sim

      # The vault core of the iPhone app (ios/ApassyCore) has no macOS code, so the
      # linux job lints it and the relay job tests it. The iPhone slices need Xcode
      # (ios/README.md).

      - name: Run P0 Node model tests
        run: node --test design/walkthrough/model.test.mjs

      - name: Run Python fixture boundary tests
        run: python3 tests/isolation/test_fixture_boundary.py

      - name: Install Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Test CI helpers
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_ci_*.py'
          python3 -m unittest discover -s scripts/tests -p 'test_extension_package.py'
          python3 -m unittest discover -s scripts/tests -p 'test_dmg_notary_retry.py'

      - name: Test the bouncer brain server without torch
        run: |
          python3 -m venv "$RUNNER_TEMP/brain-venv"
          "$RUNNER_TEMP/brain-venv/bin/pip" install --quiet 'fastapi==0.141.1' 'httpx==0.28.1'
          "$RUNNER_TEMP/brain-venv/bin/python" -I -B -m unittest discover -s tests/basemodel -p 'test_*.py'
          # The K1 bench script (implementation plan 0035, E2) without a server or torch.
          "$RUNNER_TEMP/brain-venv/bin/python" -I -B tools/basemodel/bench.py --dry-run

      - name: Check coordinated release versions
        run: |
          python3 scripts/check-release-versions.py
          python3 -m unittest discover -s scripts/tests -p 'test_release_versions.py'

      - name: Check git diff whitespace
        run: git diff --check

  # Keep the existing macos/linux check names. Full Rust test coverage runs in
  # the separate matrix below. Release waits for the entire CI workflow.
  linux:
    needs: reuse-pr
    if: always() && !cancelled() && needs.reuse-pr.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.97.0
        run: rustup toolchain install 1.97.0 --profile minimal --component clippy

      # The action keys dependencies by OS, architecture, compiler, lockfile,
      # and Cargo configuration. PRs can restore caches but cannot save them.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: dev-quality
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Fetch Cargo dependencies
        run: cargo fetch --locked

      - name: Run Clippy
        run: cargo clippy --offline --locked --all-features --all-targets -- -D warnings

      # The relay (ADR 0037) and the vault core of the iPhone app (ADR 0023) are
      # workspace members outside the default members above. Both use the apassy
      # library with the `vault` feature only. The relay job runs their tests.
      - name: Run Clippy on the relay and the iPhone vault core
        run: cargo clippy --offline --locked -p apassy-relay -p apassy-core --all-targets -- -D warnings

      # The app binary (crates/apassy-app) is outside the default members: it joins the
      # core with the relay crate for the Mac's own node (ADR 0037).
      - name: Run Clippy on the app crate
        run: cargo clippy --offline --locked -p apassy-app --all-targets -- -D warnings

      - name: Check vault API compile failures
        run: cargo test --offline --locked --features vault --doc

      - name: Run Python fixture boundary tests
        run: python3 tests/isolation/test_fixture_boundary.py

      # The JSON Schemas in packs/schema/ describe the structure of a pack for editors
      # and contributors. This step keeps them in step with the real files.
      - name: Check the rule packs and provider files with the JSON Schemas
        run: |
          pipx run --spec check-jsonschema==0.38.2 check-jsonschema --check-metaschema packs/schema/*.json
          pipx run --spec check-jsonschema==0.38.2 check-jsonschema --schemafile packs/schema/rule-pack.schema.json packs/*.json
          pipx run --spec check-jsonschema==0.38.2 check-jsonschema --schemafile packs/schema/provider.schema.json packs/providers/*.json

      # The loaders are the authority. The same check that CONTRIBUTING.md asks for.
      - name: Check the rule packs and provider files with the loaders
        run: cargo run --offline --locked --features vault --bin apassy-packs -- validate packs/*.json packs/providers/*.json

  # The tests of the relay crate (ADR 0037) and of the vault core of the iPhone app
  # (ADR 0023), and the relay end-to-end script with the real binaries. Both crates
  # use the apassy library with the `vault` feature only, so one build serves both.
  # Two jobs build the same targets and each runs one slice of the tests; the first
  # also runs the doc tests and the end-to-end script. Both use one cache key.
  # The linux job runs their Clippy, the macOS job checks the format (`cargo fmt --all`).
  relay:
    needs: reuse-pr
    if: always() && !cancelled() && needs.reuse-pr.outputs.reuse != 'true'
    name: relay (${{ matrix.slice }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        slice: [1, 2]
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.97.0
        run: rustup toolchain install 1.97.0 --profile minimal
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: dev-relay
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Fetch Cargo dependencies
        run: cargo fetch --locked
      - name: Install cargo-nextest 0.9.150
        run: bash scripts/ci-install-nextest.sh
      - name: Run the relay and iPhone vault core tests
        env:
          NEXTEST_TEST_THREADS: "8"
          SLICE: ${{ matrix.slice }}
        run: >-
          cargo nextest run --profile ci --offline --locked -p apassy-relay -p apassy-core
          --partition "slice:$SLICE/2"
      - name: Verify vendored HTTP listener shutdown
        if: matrix.slice == 1
        run: cargo nextest run --profile ci --offline --locked -p tiny_http --test shutdown
      # nextest does not run doc tests.
      - name: Run the relay and iPhone vault core doc tests
        if: matrix.slice == 1
        run: cargo test --offline --locked -p apassy-relay -p apassy-core --doc
      # The app crate is built on its own: built together with the relay, the core
      # would get the desktop feature in the relay tests too.
      - name: Run the app crate tests
        if: matrix.slice == 1
        run: cargo nextest run --profile ci --offline --locked -p apassy-app
      - name: Run the relay end-to-end script
        if: matrix.slice == 1
        run: bash crates/apassy-relay/scripts/e2e.sh
      # A test or the script that leaves a process running delays the end of the job:
      # the runner then stops each leftover process. List them for the log.
      - name: List leftover processes
        if: always()
        run: ps -eo pid,ppid,pgid,etimes,args --sort=pid | awk '$5 !~ /^\[/'

  relay-worker:
    needs: reuse-pr
    if: always() && !cancelled() && needs.reuse-pr.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: crates/apassy-relay/deploy/worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crates/apassy-relay/deploy/worker/package-lock.json
      - name: Run Worker tests
        run: node --test 'test/*.test.ts'
      # The push gateway (push-gateway-v1): the same Node test runner, no dependency.
      - name: Run push gateway tests
        working-directory: crates/apassy-relay/deploy/push-gateway
        run: node --test 'test/*.test.ts'
      - name: Install typecheck dependencies
        run: npm ci --no-audit --no-fund
      - name: Check Worker types
        run: npx tsc -p tsconfig.json
      # The gateway has no lockfile: its types are checked with the Worker's dependencies.
      - name: Check push gateway types
        working-directory: crates/apassy-relay/deploy/push-gateway
        run: ../worker/node_modules/.bin/tsc -p tsconfig.json

  # The Linux node (plan S2-S3, D8, units L1 to L3): `apassy-app` without the window
  # builds, has no eframe in its dependency graph, and the packaging scripts make, install,
  # and check a .tar.gz and a .deb of this debug build (packaging/linux/verify.sh: the
  # units pass `systemd-analyze verify`, install.sh installs from a file:// directory).
  # The release builds of both machines are in relay-image.yml.
  linux-node:
    needs: reuse-pr
    if: always() && !cancelled() && needs.reuse-pr.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.97.0
        run: rustup toolchain install 1.97.0 --profile minimal
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: dev-node
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Fetch Cargo dependencies
        run: cargo fetch --locked
      - name: The node build has no eframe
        run: |
          mkdir -p target
          cargo tree --offline --locked -p apassy-app --no-default-features --features node \
            -e normal,build --prefix none > target/node-tree.txt
          grep -q '^apassy-relay ' target/node-tree.txt
          count="$(grep -c eframe target/node-tree.txt || true)"
          if [ "$count" != 0 ]; then
            echo "::error::apassy-app --no-default-features --features node resolves eframe ($count lines)."
            grep eframe target/node-tree.txt
            exit 1
          fi
      - name: Build the node without the window
        run: cargo build --offline --locked -p apassy-app --no-default-features --features node --bin apassy-app
      - name: Check the packaging scripts
        run: >-
          shellcheck packaging/linux/build.sh packaging/linux/tarball.sh packaging/linux/verify.sh
          packaging/linux/apassy-team packaging/linux/deb/postinst
          crates/apassy-relay/deploy/worker/public/install.sh
      - name: Package and verify the debug build
        run: |
          mkdir -p target/node-dist
          cp target/debug/apassy-app target/node-dist/apassy
          strip target/node-dist/apassy
          packaging/linux/build.sh --binary target/node-dist/apassy --arch x86_64 --out target/node-dist
          rm target/node-dist/apassy
          packaging/linux/verify.sh --dist target/node-dist --arch x86_64

  audit:
    needs: reuse-pr
    if: always() && !cancelled() && needs.reuse-pr.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.97.0
        run: rustup toolchain install 1.97.0 --profile minimal
      - name: Restore cargo-audit
        id: audit-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ runner.arch }}-rust-1.97.0-v0.22.2
      - name: Install cargo-audit 0.22.2
        if: steps.audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Check RustSec advisories
        run: |
          cargo-audit --version | grep -Fx 'cargo-audit 0.22.2'
          cargo audit
      # The advisory database is refreshed on every run. Only the tool is cached.
      # Bundled C code still needs the policy in docs/reviews/storage-dependencies.md.
      - name: Save cargo-audit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.audit-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ steps.audit-cache.outputs.cache-primary-key }}

  # The Rust tests of the apassy package run with cargo-nextest: each test in its own
  # process, several at a time (.config/nextest.toml). Linux splits the tests into
  # four slices and macOS into two; `--partition slice:K/N` gives each test to
  # exactly one slice of its OS. The tests use the processors of the runner fully,
  # so a slice takes about 1/N of the CPU time of the suite.
  tests:
    needs: reuse-pr
    if: always() && !cancelled() && needs.reuse-pr.outputs.reuse != 'true'
    name: tests (${{ matrix.os }}, ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # A draft pull request runs the Linux groups only. A ready pull request
        # runs four macOS jobs (two test groups, macos, extension), and a push to
        # main five (release-binaries): within the five-runner macOS limit.
        os: ${{ fromJSON(github.event.pull_request.draft && '["ubuntu-24.04"]' || '["macos-15", "ubuntu-24.04"]') }}
        shard: [0, 1, 2, 3]
        exclude:
          - os: macos-15
            shard: 2
          - os: macos-15
            shard: 3
    env:
      TEST_SHARD_COUNT: ${{ matrix.os == 'macos-15' && 2 || 4 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.97.0
        run: rustup toolchain install 1.97.0 --profile minimal
      # The keys of the earlier serial groups (three on macOS, four on Linux): their
      # caches hold the same dependencies, built with the same features.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: dev-tests-${{ matrix.os == 'macos-15' && '3' || '4' }}-${{ matrix.shard }}
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Fetch Cargo dependencies
        run: cargo fetch --locked
      - name: Install cargo-nextest 0.9.150
        run: bash scripts/ci-install-nextest.sh
      # Many tests wait (for a timeout, a child process, or a socket), so each runner
      # runs twice as many tests as it has processors. Slices count from 1.
      - name: Run test group
        env:
          TEST_SHARD: ${{ matrix.shard }}
          NEXTEST_TEST_THREADS: ${{ matrix.os == 'macos-15' && '6' || '8' }}
        run: >-
          cargo nextest run --profile ci --offline --locked --all-features --all-targets
          --partition "slice:$((TEST_SHARD + 1))/$TEST_SHARD_COUNT"

  # The Linux sandbox (unit X1 of docs/design/implementation-plan-s5-env-0011.md,
  # docs/operations/isolation-linux.md). Its tests need bubblewrap and unprivileged
  # user namespaces, which the test matrix does not have, so they report a skip
  # there. This job installs bubblewrap, records what the runner allows before any
  # change (the measurement that the plan asks for), allows user namespaces, and
  # runs the isolation tests with APASSY_REQUIRE_BWRAP=1: here a test fails, and
  # never skips, when bubblewrap cannot run.
  linux-isolation:
    needs: reuse-pr
    if: always() && !cancelled() && needs.reuse-pr.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.97.0
        run: rustup toolchain install 1.97.0 --profile minimal
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: dev-isolation
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Fetch Cargo dependencies
        run: cargo fetch --locked
      - name: Install cargo-nextest 0.9.150
        run: bash scripts/ci-install-nextest.sh
      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
          ls -l "$(command -v bwrap)"
          bwrap --version
      # The same namespace options as src/isolation/linux/bwrap.rs (namespace_args).
      - name: Record user namespaces with the runner defaults
        id: userns
        run: |
          uname -r
          for knob in kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone user.max_user_namespaces; do
            file="/proc/sys/$(echo "$knob" | tr . /)"
            if [ -e "$file" ]; then echo "$knob=$(cat "$file")"; else echo "$knob: not present"; fi
          done
          ls /etc/apparmor.d | grep -i -e bwrap -e userns || echo "no AppArmor profile named bwrap or userns"
          if bwrap --unshare-user --unshare-ipc --unshare-pid --unshare-uts --unshare-cgroup-try \
               --unshare-net --disable-userns --die-with-parent --new-session --as-pid-1 \
               --ro-bind / / --dev /dev --proc /proc true; then
            echo "measurement: bubblewrap makes the sandbox with the runner defaults"
            echo "expect=netns" >> "$GITHUB_OUTPUT"
          else
            echo "measurement: bubblewrap cannot make the sandbox with the runner defaults (exit $?)"
            echo "expect=none:userns_blocked" >> "$GITHUB_OUTPUT"
          fi
      # Judge finding L3: what a proxied run reports on the stock runner follows the
      # measurement above: `none` with `userns_blocked` where user namespaces are
      # restricted, `netns` where they are not.
      - name: Check the network rule of a run with the runner defaults
        env:
          APASSY_EXPECT_RULE: ${{ steps.userns.outputs.expect }}
        run: >-
          cargo nextest run --profile ci --offline --locked --all-features
          --test it -E 'test(=run_proxy::linux_proxied_run_reports_the_measured_rule)'
          --no-capture
      - name: Allow unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-user --unshare-ipc --unshare-pid --unshare-uts --unshare-cgroup-try \
            --unshare-net --disable-userns --die-with-parent --new-session --as-pid-1 \
            --ro-bind / / --dev /dev --proc /proc true
          echo "bubblewrap makes the sandbox"
      - name: Run the Linux isolation tests
        env:
          APASSY_REQUIRE_BWRAP: "1"
          NEXTEST_TEST_THREADS: "8"
        run: >-
          cargo nextest run --profile ci --offline --locked --all-features
          --lib --test it -E 'test(/^isolation(::|_linux::)/) | test(/^broker::proxy::network::/) | test(/^run_proxy::linux_/) | test(=agent_run::a_placeholder_variable_gets_a_placeholder_and_the_run_proxy)'
      - name: List leftover processes
        if: always()
        run: ps -eo pid,ppid,pgid,etimes,args --sort=pid | awk '$5 !~ /^\[/'

  release-binaries:
    # No signing credentials enter this job. Its artifact is eligible for Release
    # only after all CI jobs pass for a push to main in this repository, so a pull
    # request does not build it; the macos job compiles the same features.
    if: github.event_name != 'pull_request' && inputs.context_experiment != 'development-diagnostic' && inputs.context_experiment != 'cuda-preflight'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.97.0
        run: rustup toolchain install 1.97.0 --profile minimal
      - name: Cache release dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-desktop-vault
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Set the build identity
        run: |
          echo "APASSY_BUILD_COMMIT=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "APASSY_BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Build the release binaries
        run: cargo build --release --locked -p apassy -p apassy-app --features apassy/desktop,apassy/vault --bin apassy-app --bin apassy-mcp --bin apassy-hook --bin apassy-sandbox --bin apassy-browser-host
      - name: Install Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Record the artifact identity and hashes
        run: |
          python3 scripts/ci-release-artifact.py create \
            --directory "$RUNNER_TEMP/apassy-release" \
            --commit "$APASSY_BUILD_COMMIT" --date "$APASSY_BUILD_DATE" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Save the unsigned release binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apassy-release-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/apassy-release/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
