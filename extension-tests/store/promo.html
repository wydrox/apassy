<!doctype html>
<!-- The small promo tile of the Chrome Web Store, 440x280, without text: the
     Apassy icon, a popup with two logins, and a Touch ID print. It must read
     at half size, so only big shapes. make-assets.mjs takes a screenshot. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
  body {
    position: relative;
    background:
      linear-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 1px) 0 0 / 28px 28px,
      linear-gradient(90deg, rgba(255, 255, 255, 0.07) 1px, transparent 1px) 0 0 / 28px 28px,
      radial-gradient(360px 260px at 20% 30%, #3d94ff 0%, transparent 70%),
      linear-gradient(135deg, #0a77fe 0%, #0759c4 100%);
  }

  /* The app icon: the dark tile with the arch and the open door. */
  .tile {
    position: absolute; left: 44px; top: 65px; width: 150px; height: 150px; border-radius: 34px;
    display: grid; place-items: center; background: #0e1820;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.10) inset, 0 18px 40px rgba(4, 22, 52, 0.45);
  }
  .tile svg { width: 92px; height: auto; margin-top: 6px; }

  /* The popup: two login rows, the first one picked. */
  .popup {
    position: absolute; left: 224px; top: 52px; width: 176px; padding: 12px; border-radius: 16px; background: #ffffff;
    box-shadow: 0 20px 44px rgba(4, 22, 52, 0.40);
  }
  .head { display: flex; align-items: center; gap: 8px; padding: 0 4px 10px; border-bottom: 2px solid #e3e7eb; }
  .dot { width: 16px; height: 16px; border-radius: 5px; background: #0e1820; }
  .bar { height: 8px; border-radius: 4px; background: #d5dbe1; }
  .row { display: flex; align-items: center; gap: 10px; margin-top: 8px; padding: 9px 8px; border-radius: 10px; }
  .row.on { background: #e3efff; }
  .avatar { flex: none; width: 26px; height: 26px; border-radius: 8px; background: #0e1820; }
  .row:not(.on) .avatar { background: #c5cdd5; }
  .lines { flex: 1; display: grid; gap: 6px; }
  .lines .bar:first-child { width: 80%; background: #0e1820; }
  .row:not(.on) .lines .bar:first-child { background: #aab4be; }
  .lines .bar:last-child { width: 55%; }

  /* The Touch ID print, over the corner of the popup. */
  .touch {
    position: absolute; left: 340px; top: 168px; width: 76px; height: 76px; border-radius: 50%;
    display: grid; place-items: center; background: #0e1820;
    box-shadow: 0 0 0 5px rgba(255, 255, 255, 0.95), 0 16px 34px rgba(4, 22, 52, 0.45);
  }
  .touch svg { width: 50px; height: 50px; fill: none; stroke: #ffffff; stroke-width: 1.6; stroke-linecap: round; }
</style>
</head>
<body>
  <div class="tile">
    <svg viewBox="0 0 229 206.2" aria-hidden="true"><path fill="#ffffff" d="M0,114.5A114.5,114.5 0 0 1 229,114.5L229,204.2A2,2 0 0 1 227,206.2L190.5,206.2A21,21 0 0 1 169.5,185.2L169.5,114.5A55,55 0 0 0 59.5,114.5L59.5,204.2A2,2 0 0 1 57.5,206.2L2,206.2A2,2 0 0 1 0,204.2Z"/><path fill="#0a77fe" d="M75,97.76A2.5,2.5 0 0 1 78.47,95.45L105.54,106.78A26,26 0 0 1 121.5,130.76L121.5,178.76A3,3 0 0 1 119.95,181.39L76.48,205.38A1,1 0 0 1 75,204.51Z"/></svg>
  </div>
  <div class="popup">
    <div class="head"><span class="dot"></span><span class="bar" style="width: 60px"></span></div>
    <div class="row on"><span class="avatar"></span><span class="lines"><span class="bar"></span><span class="bar"></span></span></div>
    <div class="row"><span class="avatar"></span><span class="lines"><span class="bar"></span><span class="bar"></span></span></div>
  </div>
  <div class="touch">
    <svg viewBox="0 0 24 24"><path d="M12 3.5a8.5 8.5 0 0 0-8.5 8.5M12 3.5a8.5 8.5 0 0 1 8.5 8.5v1M7 8.6A5.9 5.9 0 0 1 17.9 12v2.2M6.1 12a5.9 5.9 0 0 0 .6 2.6M12 8.6a3.4 3.4 0 0 0-3.4 3.4c0 3 1 5.3 2.6 7.4M12 8.6a3.4 3.4 0 0 1 3.4 3.4v1.2c0 2 .4 3.6 1.2 5M12 12v1.3c0 2.6.8 4.8 2.2 6.6" /></svg>
  </div>
</body>
</html>
