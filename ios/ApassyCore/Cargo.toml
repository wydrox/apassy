[package]
name = "apassy-core"
version = "0.3.4"
edition = "2024"
rust-version = "1.97"
publish = false
license = "Apache-2.0"
description = "The vault core of the Apassy iPhone app: a C interface over the apassy vault and relay sync"

[lib]
name = "apassy_core"
crate-type = ["staticlib", "rlib"]

[dependencies]
apassy = { path = "../..", features = ["vault"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
zeroize = "=1.9.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
