[package]
name = "apassy-core"
version = "0.5.19"
edition = "2024"
rust-version = "1.97"
publish = false
license = "Apache-2.0"
description = "The vault core of the Apassy iPhone app: a C interface over the apassy vault and relay sync"

[lib]
name = "apassy_core"
crate-type = ["staticlib", "rlib"]

[dependencies]
apassy = { path = "../..", default-features = false, features = ["vault"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
zeroize = "=1.9.0"
# The same versions as the apassy crate: TOTP (HMAC) and SHA-256, and the generator.
ring = { version = "=0.17.14", default-features = false, features = ["alloc"] }
getrandom = "=0.4.3"

[features]
# Vendored OpenSSL for SQLCipher (iPhone, Simulator, macOS tests). The Apple Watch slices build
# with --no-default-features: SQLCipher then uses CommonCrypto (ADR 0039 section 4).
default = ["openssl"]
openssl = ["apassy/openssl"]

[dev-dependencies]
# tests/connect_dial.rs (plan s7 unit I2): the loopback Connect is the relay crate's own
# server with the account routes and the tunnel. A workspace member, no new crate.
apassy-relay = { path = "../../crates/apassy-relay" }
tempfile = "=3.27.0"
rusqlite = { version = "=0.42.0", default-features = false, features = ["bundled-sqlcipher-vendored-openssl"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
