# XcodeGen spec for the Apassy iPhone app (ADR 0020, ADR 0023), its AutoFill extension, and the
# Apple Watch app that answers access requests (ADR 0039, embedded in the iPhone app).
#
# Regenerate the project after a change to this file:
#
#   cd ios/ApassyCompanion && xcodegen generate --spec project.yml
#
# The app links the vault core (ios/ApassyCore) through the package ios/ApassyVaultKit. Build
# the core first: scripts/build-ios-core.sh (the XCFramework is not committed).
#
# The project is committed, as native/ApassyKeychain/ApassyKeychain.xcodeproj is. It sets no
# DEVELOPMENT_TEAM: the owner selects a team in Xcode (Signing & Capabilities) or passes
# DEVELOPMENT_TEAM=<id> to xcodebuild. Info.plist files are written from the properties below.
name: ApassyCompanion
options:
  bundleIdPrefix: com.wydrox.apassy
  deploymentTarget:
    iOS: "26.0"
    watchOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    # The app has no App Intents. This stops the note "Metadata extraction skipped".
    LM_SKIP_METADATA_EXTRACTION: YES
    MARKETING_VERSION: 0.5.15
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    # The vault core has an arm64 Simulator slice only (Apple silicon).
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
packages:
  ApassyCompanionKit:
    path: ../ApassyCompanionKit
  ApassyVaultKit:
    path: ../ApassyVaultKit
targets:
  ApassyCompanion:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
      # The notices and license texts of the code and data in the app (Settings > Licenses).
      - path: ../../licenses
        type: folder
        buildPhase: resources
    dependencies:
      - package: ApassyCompanionKit
      - package: ApassyVaultKit
        product: ApassyVaultKit
      - package: ApassyVaultKit
        product: ApassyVaultCore
      - target: ApassyAutoFill
        embed: true
      # Opens the sealed summary of a push (push-gateway-v1 section 12).
      - target: ApassyNotifications
        embed: true
      # The watch app, as the Watch content of the iPhone app.
      - target: ApassyWatch
        embed: true
    entitlements:
      path: Apassy.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.wydrox.apassy.companion
        # The first group is the default: the companion keys stay where they were.
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.wydrox.apassy.companion
          - $(AppIdentifierPrefix)com.wydrox.apassy.shared
          # The summary keys of the questions teams, shared with ApassyNotifications only.
          - $(AppIdentifierPrefix)com.wydrox.apassy.push
        com.apple.developer.authentication-services.autofill-credential-provider: true
        # Questions through the relay (contract relay-questions-v1, section 14.2). Xcode writes
        # `production` into an App Store or TestFlight export. Both need the Push Notifications and
        # Time Sensitive Notifications capabilities on the App ID and new provisioning profiles.
        aps-environment: development
        com.apple.developer.usernotifications.time-sensitive: true
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Apassy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ApassyBuildCommit: $(APASSY_BUILD_COMMIT)
        LSRequiresIPhoneOS: true
        LSSupportsOpeningDocumentsInPlace: true
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.wydrox.apassy.vault
            UTTypeDescription: Apassy Vault
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - apassy
        CFBundleDocumentTypes:
          - CFBundleTypeName: Apassy Vault
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.wydrox.apassy.vault
        ITSAppUsesNonExemptEncryption: false
        ApassyAppIdentifierPrefix: $(AppIdentifierPrefix)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiredDeviceCapabilities:
          - arm64
        # App Store Connect refuses an app without all four (iPad multitasking).
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: Apassy connects to your Mac on this Wi-Fi network to show the runs that wait for you and to send your decision.
        NSCameraUsageDescription: Apassy uses the camera only to scan a code that your Mac shows, to add this iPhone. It saves no picture.
        NSFaceIDUsageDescription: Apassy uses Face ID to unlock your vault, and before it shows, copies, or fills a secret, moves your passwords and passkeys to or from another app, or approves a run.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Apple's credential exchange opens the app with this activity to import from another app
        # (the value of ASCredentialExchangeActivity).
        NSUserActivityTypes:
          - ASCredentialExchangeActivity
        # The notification of a question wakes nothing; it opens Questions when tapped. The mode
        # lets iOS hand the APNs device token to the app (contract relay-questions-v1, section 14.2).
        UIBackgroundModes:
          - remote-notification
    settings:
      base:
        PRODUCT_NAME: ApassyCompanion
        PRODUCT_BUNDLE_IDENTIFIER: com.wydrox.apassy.companion
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets: [ApassyCompanionUITests]
  ApassyAutoFill:
    type: app-extension
    platform: iOS
    sources:
      - path: AutoFill
    dependencies:
      - package: ApassyVaultKit
        product: ApassyVaultKit
      - package: ApassyVaultKit
        product: ApassyVaultCore
      - sdk: AuthenticationServices.framework
    entitlements:
      path: AutoFill/ApassyAutoFill.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.wydrox.apassy.companion
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.wydrox.apassy.shared
        com.apple.developer.authentication-services.autofill-credential-provider: true
    info:
      path: AutoFill/Info.plist
      properties:
        CFBundleDisplayName: Apassy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ApassyBuildCommit: $(APASSY_BUILD_COMMIT)
        ApassyAppIdentifierPrefix: $(AppIdentifierPrefix)
        NSFaceIDUsageDescription: Apassy uses Face ID before it fills a password or a code, signs in with a passkey, or saves a passkey.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.authentication-services-credential-provider-ui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CredentialProviderViewController
          NSExtensionAttributes:
            # iOS calls prepareInterfaceForExtensionConfiguration only with this key.
            ASCredentialProviderExtensionShowsConfigurationUI: true
            ASCredentialProviderExtensionCapabilities:
              ProvidesPasswords: true
              ProvidesOneTimeCodes: true
              ProvidesPasskeys: true
              # Apple's credential exchange (iOS 26): Apassy can import from and export to
              # another credential manager through the system.
              SupportsCredentialExchange: true
              SupportedCredentialExchangeVersions:
                - "1.0"
    settings:
      base:
        PRODUCT_NAME: ApassyAutoFill
        PRODUCT_BUNDLE_IDENTIFIER: com.wydrox.apassy.companion.autofill
        INFOPLIST_FILE: AutoFill/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
  # The Notification Service Extension of the iPhone app (push-gateway-v1 section 12): it opens the
  # sealed summary of a push of a node with a summary key from the Keychain group
  # com.wydrox.apassy.push and shows its title and body; on any failure the fixed text stays. No
  # network, no vault, no App Group, no log. Apple frameworks and ApassyVaultKit only (no Rust core).
  ApassyNotifications:
    type: app-extension
    platform: iOS
    sources:
      - path: Notifications
    dependencies:
      - package: ApassyVaultKit
        product: ApassyVaultKit
    entitlements:
      path: Notifications/ApassyNotifications.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.wydrox.apassy.push
    info:
      path: Notifications/Info.plist
      properties:
        CFBundleDisplayName: Apassy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ApassyBuildCommit: $(APASSY_BUILD_COMMIT)
        ApassyAppIdentifierPrefix: $(AppIdentifierPrefix)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_NAME: ApassyNotifications
        PRODUCT_BUNDLE_IDENTIFIER: com.wydrox.apassy.companion.notifications
        INFOPLIST_FILE: Notifications/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
  # The Apple Watch app (ADR 0039): access requests only, Allow once while the watch is unlocked on
  # the wrist. arm64 watches only: stable Rust has no arm64_32 standard library. The vault core
  # needs its watchOS slices (scripts/build-ios-core.sh watch watchsim).
  ApassyWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: Watch/Sources
      - path: Watch/Resources
    dependencies:
      - package: ApassyVaultKit
        product: ApassyVaultKit
      - package: ApassyVaultKit
        product: ApassyVaultCore
      # Opens the sealed summary of the watch's own push (push-gateway-v1 sections 11 and 12).
      - target: ApassyWatchNotifications
        embed: true
    entitlements:
      path: Watch/ApassyWatch.entitlements
      properties:
        # The answer keys and the replica passphrase stay in a group of the watch only (the first
        # group is the default); the summary key of its questions team goes in a group shared with
        # ApassyWatchNotifications only.
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.wydrox.apassy.watch
          - $(AppIdentifierPrefix)com.wydrox.apassy.watch.push
        # "Notifications on this watch" (push-gateway-v1 section 11): the watch's own APNs token for
        # a handle of the push gateway. Xcode writes `production` into an App Store or TestFlight
        # export. Needs Push Notifications and Time Sensitive Notifications on the watch App ID.
        aps-environment: development
        com.apple.developer.usernotifications.time-sensitive: true
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Apassy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ApassyBuildCommit: $(APASSY_BUILD_COMMIT)
        # The team prefix of the Keychain group of the summary key (KeychainPushSummaryKeyStore).
        ApassyAppIdentifierPrefix: $(AppIdentifierPrefix)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.wydrox.apassy.companion
        ITSAppUsesNonExemptEncryption: false
        # A node on the tailnet (node-pairing-v1): the watch reaches `https://<Tailscale IPv4>:8444`
        # with the pinned certificate of the node (URLSessionCoreTransport), as the iPhone app.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_NAME: ApassyWatch
        PRODUCT_BUNDLE_IDENTIFIER: com.wydrox.apassy.companion.watchkitapp
        INFOPLIST_FILE: Watch/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "4"
        # watchOS 27 runs on arm64 watches only, so App Store Connect accepts an app
        # without arm64_32. Below 27.0 it refuses the upload (missing arm64_32).
        WATCHOS_DEPLOYMENT_TARGET: "27.0"
        # arm64 only (the vault core has no arm64_32 slice).
        ARCHS[sdk=watchos*]: arm64
        EXCLUDED_ARCHS[sdk=watchos*]: arm64_32
        EXCLUDED_ARCHS[sdk=watchsimulator*]: x86_64
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Archived inside the iPhone app, not as a product of its own.
        SKIP_INSTALL: YES
    scheme: {}
  # The Notification Service Extension of the watch app (push-gateway-v1 sections 11 and 12): the
  # same as ApassyNotifications, with the Keychain group com.wydrox.apassy.watch.push; a run
  # question shows "Answer on your iPhone or Mac". arm64 only, as the watch app.
  ApassyWatchNotifications:
    type: app-extension
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: Watch/Notifications
    dependencies:
      - package: ApassyVaultKit
        product: ApassyVaultKit
    entitlements:
      path: Watch/Notifications/ApassyWatchNotifications.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.wydrox.apassy.watch.push
    info:
      path: Watch/Notifications/Info.plist
      properties:
        CFBundleDisplayName: Apassy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ApassyBuildCommit: $(APASSY_BUILD_COMMIT)
        ApassyAppIdentifierPrefix: $(AppIdentifierPrefix)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_NAME: ApassyWatchNotifications
        PRODUCT_BUNDLE_IDENTIFIER: com.wydrox.apassy.companion.watchkitapp.notifications
        INFOPLIST_FILE: Watch/Notifications/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "27.0"
        ARCHS[sdk=watchos*]: arm64
        EXCLUDED_ARCHS[sdk=watchos*]: arm64_32
        EXCLUDED_ARCHS[sdk=watchsimulator*]: x86_64
        SKIP_INSTALL: YES
  # Checks of the screens in the Simulator, with the synthetic preview vault only (the launch
  # arguments in ios/README.md). Not a part of the app.
  ApassyCompanionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: ApassyCompanion
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.wydrox.apassy.companion.uitests
        TEST_TARGET_NAME: ApassyCompanion
