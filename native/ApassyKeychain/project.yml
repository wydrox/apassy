# XcodeGen spec for the keychain helper app.
#
# scripts/build-app.sh --provision uses this project only to get a
# development provisioning profile with Xcode automatic signing
# (xcodebuild -allowProvisioningUpdates). The app itself is built with swiftc
# by the script. Regenerate the project after a change to this file:
#
#   xcodegen generate --spec native/ApassyKeychain/project.yml
name: ApassyKeychain
options:
  bundleIdPrefix: com.wydrox.apassy
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
targets:
  ApassyKeychain:
    type: application
    platform: macOS
    sources:
      - path: ../ApassyHelper
    settings:
      base:
        PRODUCT_NAME: ApassyKeychain
        PRODUCT_BUNDLE_IDENTIFIER: com.wydrox.apassy.keychain
        INFOPLIST_FILE: ../../packaging/ApassyKeychain-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: ApassyKeychain.entitlements
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    scheme: {}
