<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apassy</title>
<style>
:root{
  --bg:#ffffff;--side:#ececef;--detail:#f6f6f7;--group:#ffffff;
  --line:rgba(0,0,0,.09);--line2:rgba(0,0,0,.06);
  --label:rgba(0,0,0,.88);--sec:rgba(0,0,0,.52);--ter:rgba(0,0,0,.30);
  --fill:rgba(0,0,0,.05);--fill2:rgba(0,0,0,.08);--fill3:rgba(0,0,0,.12);
  --accent:#0a6cff;--accent-press:#005ee0;--sel:#0a6cff;
  --red:#e0352b;--orange:#c86a00;--green:#24a148;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font:13px/1.38 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;color:var(--label);-webkit-font-smoothing:antialiased;background:#cfd0d5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:default}
.stage{height:100vh;padding:28px;display:flex;align-items:stretch;justify-content:center}
.win{display:flex;width:100%;max-width:1320px;background:var(--bg);border-radius:12px;overflow:hidden;box-shadow:0 0 0 .5px rgba(0,0,0,.25),0 22px 70px rgba(0,0,0,.28);position:relative}
.side{width:216px;flex:none;background:var(--side);border-right:.5px solid var(--line);display:flex;flex-direction:column}
.side .chrome{height:52px;flex:none;display:flex;align-items:center;padding:0 18px;gap:8px}
.lights{display:flex;gap:8px}.lights i{width:12px;height:12px;border-radius:50%;display:block;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.15)}
.side .scroll{flex:1;overflow-y:auto;padding:0 10px 10px}
.sh{font-size:11px;font-weight:600;color:var(--sec);padding:12px 8px 4px;display:flex;align-items:center}
.sh .add{margin-left:auto;opacity:0;border:0;background:none;width:18px;height:18px;border-radius:4px;color:var(--sec);display:grid;place-items:center;padding:0}
.sh .add svg{width:12px;height:12px}
.sh:hover .add{opacity:1}.sh .add:hover{background:var(--fill2)}
.si{display:flex;align-items:center;gap:7px;width:100%;height:28px;border:0;background:none;border-radius:6px;padding:0 8px;text-align:left}
.si:hover{background:rgba(0,0,0,.04)}
.si.on{background:rgba(0,0,0,.09)}
.si svg{width:15px;height:15px;flex:none;color:var(--accent)}
.si .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.si .cnt{color:var(--sec);font-size:12px;font-variant-numeric:tabular-nums}
.si .bdg{background:rgba(0,0,0,.14);color:var(--label);font-size:11px;font-weight:600;border-radius:9px;padding:0 6px;min-width:18px;text-align:center}
.si .bdg.hot{background:var(--red);color:#fff}
.si.l1{padding-left:22px}.si.l2{padding-left:38px}
.si .tw{width:12px;margin-left:-14px;color:var(--sec);font-size:8px;text-align:center;flex:none}
.sq{width:13px;height:13px;border-radius:3.5px;flex:none;margin:0 1px}
.side .foot{padding:8px 10px 10px;border-top:.5px solid var(--line)}
.me{display:flex;align-items:center;gap:8px;padding:4px 6px}
.me .av{width:22px;height:22px;border-radius:50%;background:linear-gradient(#ffa43a,#ff8a00);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:600;flex:none}
.me .t{flex:1;line-height:1.2}.me .t small{display:block;color:var(--sec);font-size:11px}
.ib{border:0;background:none;width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--sec);padding:0;flex:none}
.ib:hover{background:var(--fill2)}
.ib svg{width:16px;height:16px}
.listcol{width:300px;flex:none;border-right:.5px solid var(--line);display:flex;flex-direction:column;background:var(--bg)}
.tb{height:52px;flex:none;display:flex;align-items:center;padding:0 10px 0 16px;gap:6px}
.tb .ttl{flex:1;min-width:0;line-height:1.2}
.tb .ttl b{font-size:13px;font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb .ttl small{font-size:11px;color:var(--sec)}
.searchf{margin:0 12px 8px;height:28px;border-radius:7px;background:var(--fill);display:flex;align-items:center;gap:6px;padding:0 8px;color:var(--ter);flex:none}
.searchf svg{width:13px;height:13px}
.rows{flex:1;overflow-y:auto;padding:0 8px 12px}
.gh{position:sticky;top:0;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);font-size:11px;font-weight:600;color:var(--sec);padding:10px 8px 4px;z-index:1;display:flex}
.gh span{margin-left:auto;font-weight:400}
.r{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;min-height:48px}
.r:hover{background:rgba(0,0,0,.03)}
.r.on{background:var(--sel);color:#fff}
.r.on .sub,.r.on .meta{color:rgba(255,255,255,.82)}
.r .tx{flex:1;min-width:0}
.r .ttl2{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .sub{font-size:12px;color:var(--sec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .meta{display:flex;align-items:center;gap:6px;color:var(--sec);font-size:12px;flex:none;font-variant-numeric:tabular-nums}
.r .meta svg{width:13px;height:13px}
.dotp{width:7px;height:7px;border-radius:50%;background:var(--red);flex:none}
.r.on .dotp{background:#fff}
.tm{color:var(--orange);font-weight:500;font-variant-numeric:tabular-nums}
.r.on .tm{color:#fff}
.tile{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;flex:none;letter-spacing:-.02em;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.12)}
.tile svg{width:16px;height:16px}
.tile.l{width:56px;height:56px;border-radius:13px;font-size:24px}.tile.l svg{width:28px;height:28px}
.tile.s{width:20px;height:20px;border-radius:5px;font-size:10px}.tile.s svg{width:11px;height:11px}
.ava{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:12px;flex:none}
.ava.l{width:56px;height:56px;font-size:22px}.ava.s{width:20px;height:20px;font-size:10px}
.detail{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--detail)}
.detail .tb{justify-content:flex-end;padding:0 12px;gap:4px}
.tbtn{border:0;background:none;height:28px;border-radius:6px;padding:0 9px;display:flex;align-items:center;gap:5px;color:var(--label)}
.tbtn:hover{background:var(--fill2)}
.tbtn svg{width:16px;height:16px;color:var(--sec)}
.dscroll{flex:1;overflow-y:auto}
.dpad{max-width:640px;margin:0 auto;padding:6px 28px 40px}
.hdr{display:flex;align-items:center;gap:14px;margin:6px 0 22px}
.hdr h1{font-size:20px;font-weight:700;margin:0;letter-spacing:-.01em;line-height:1.2}
.hdr .s{color:var(--sec);margin-top:2px}
.caps{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.cap{font-size:11px;font-weight:500;border-radius:5px;padding:1px 6px;background:var(--fill2);color:var(--sec);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.cap.red{background:rgba(224,53,43,.1);color:#c42b22}
.cap svg{width:11px;height:11px}
.gl{font-size:12px;font-weight:600;color:var(--sec);margin:18px 2px 6px;display:flex;align-items:center}
.gl a{margin-left:auto;font-weight:400;color:var(--accent);text-decoration:none}
.grp{background:var(--group);border-radius:10px;box-shadow:0 0 0 .5px rgba(0,0,0,.08),0 .5px 1.5px rgba(0,0,0,.05)}
.fr{display:flex;align-items:center;gap:10px;min-height:38px;padding:7px 12px;position:relative}
.fr+.fr::before{content:"";position:absolute;top:0;left:12px;right:0;border-top:.5px solid var(--line2)}
.fr .k{flex:none;min-width:110px;color:var(--label)}
.fr .v{flex:1;min-width:0;text-align:right;color:var(--sec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fr .v.l{text-align:left;color:var(--label);white-space:normal}
.fr .chev{color:var(--ter);font-size:15px;margin-left:-4px}
.fr.click:hover{background:rgba(0,0,0,.02)}
.mono{font-family:var(--mono);font-size:12px}
.secret{font-size:15px;letter-spacing:2px;color:var(--label)}
.pb{border:0;border-radius:6px;height:24px;padding:0 10px;background:var(--fill2);font-size:12.5px;font-weight:500;flex:none}
.pb:hover{background:var(--fill3)}
.sw{width:32px;height:19px;border-radius:10px;background:var(--fill3);position:relative;flex:none;border:0;padding:0}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 .5px 2px rgba(0,0,0,.3);transition:.15s}
.sw.on{background:var(--green)}.sw.on::after{left:15px}
.pop{border:0;background:var(--fill);border-radius:6px;height:22px;padding:0 8px;font-size:12.5px;display:inline-flex;align-items:center;gap:5px;color:var(--label)}
.pop::after{content:"";width:6px;height:6px;border-right:1.5px solid var(--sec);border-bottom:1.5px solid var(--sec);transform:rotate(45deg) translateY(-2px)}
.act{display:flex;align-items:flex-start;gap:10px}
.act .tx{flex:1;min-width:0;text-align:left}
.act .a1{color:var(--label)}.act .a2{font-size:12px;color:var(--sec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act .when{font-size:12px;color:var(--ter);flex:none}
.st{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;flex:none;margin-top:1px}
.st svg{width:10px;height:10px;color:#fff}
.st.ok{background:var(--green)}.st.you{background:var(--accent)}.st.no{background:var(--red)}
.cmd{font-family:var(--mono);font-size:12px;background:#f2f2f4;border-radius:6px;padding:8px 10px;white-space:pre-wrap;word-break:break-all;color:var(--label);flex:1;text-align:left}
.note{font-size:12px;color:var(--sec);margin:6px 4px 0;line-height:1.4}
.meta-foot{text-align:center;font-size:11px;color:var(--ter);margin-top:22px}
.banner{display:flex;align-items:center;gap:12px;background:#fff;border-radius:10px;padding:10px 12px;box-shadow:0 0 0 .5px rgba(0,0,0,.08);margin-bottom:12px}
.banner .ic{width:28px;height:28px;border-radius:7px;background:#fff4e5;color:var(--orange);display:grid;place-items:center;flex:none}
.banner .ic svg{width:16px;height:16px}
.banner .tx{flex:1;min-width:0}.banner .tx b{font-weight:600;display:block}.banner .tx span{font-size:12px;color:var(--sec)}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--sec);gap:6px;text-align:center}
.empty svg{width:40px;height:40px;color:var(--ter)}
.empty b{color:var(--label);font-size:15px;font-weight:600}
.abar{flex:none;border-top:.5px solid var(--line);background:rgba(246,246,247,.92);backdrop-filter:blur(12px);padding:10px 16px;display:flex;align-items:center;gap:8px}
.abar .cap2{flex:1;font-size:11.5px;color:var(--sec);min-width:0}
.btn{border:0;border-radius:7px;height:28px;padding:0 14px;background:#fff;box-shadow:0 0 0 .5px rgba(0,0,0,.16),0 .5px 1px rgba(0,0,0,.08);font-weight:500;white-space:nowrap;flex:none}
.btn:hover{background:#fafafa}
.btn.pri{background:var(--accent);color:#fff;box-shadow:0 .5px 1px rgba(0,0,0,.2)}.btn.pri:hover{background:var(--accent-press)}
.btn.pri:disabled{opacity:.4}
.btn.des{color:var(--red)}
.menu{position:absolute;background:rgba(250,250,250,.98);backdrop-filter:blur(20px);border-radius:8px;box-shadow:0 0 0 .5px rgba(0,0,0,.2),0 10px 30px rgba(0,0,0,.2);padding:5px;z-index:30;min-width:230px}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:0 10px;border-radius:5px;height:24px}
.menu button:hover{background:var(--accent);color:#fff}
.menu hr{border:0;border-top:.5px solid var(--line);margin:4px 6px}
.field{width:100%;border:0;border-radius:6px;background:#fff;box-shadow:0 0 0 .5px rgba(0,0,0,.18) inset;padding:7px 9px;resize:none;display:block}
.field:focus{outline:3px solid rgba(10,108,255,.35);outline-offset:0}
.veil{position:absolute;inset:0;background:rgba(0,0,0,.12);display:none;align-items:flex-start;justify-content:center;z-index:40}
.veil.on{display:flex}
.sheet{margin-top:52px;width:520px;max-width:calc(100% - 40px);background:#f6f6f7;border-radius:12px;box-shadow:0 0 0 .5px rgba(0,0,0,.25),0 24px 60px rgba(0,0,0,.3);padding:20px;max-height:calc(100% - 80px);overflow-y:auto}
.sheet.prefs{width:600px}
.sheet h2{font-size:13px;font-weight:700;margin:0 0 2px}
.sheet .lead{color:var(--sec);font-size:12px;margin:0 0 14px}
.sheet .sbar{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;align-items:center}
.sheet .sbar .left{margin-right:auto;font-size:12px;color:var(--sec);display:flex;align-items:center;gap:6px}
.ex{display:flex;gap:6px;margin-top:8px;align-items:center;font-size:11px;color:var(--ter)}
.ex button{border:0;background:var(--fill);border-radius:5px;font-size:11px;padding:2px 7px;color:var(--sec)}
.ex button:hover{background:var(--fill2)}
.dt{display:flex;align-items:center;gap:10px;padding:8px 12px;position:relative}
.dt+.dt::before{content:"";position:absolute;top:0;left:12px;right:0;border-top:.5px solid var(--line2)}
.dt input[type=text]{border:0;background:none;font-weight:500;padding:0;width:100%;outline:0}
.dt small{display:block;font-size:11.5px;color:var(--sec)}
.ptabs{display:flex;justify-content:center;gap:4px;margin:-6px 0 6px}
.ptabs button{border:0;background:none;border-radius:7px;padding:5px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--sec);width:80px}
.ptabs button svg{width:22px;height:22px}
.ptabs button.on{background:var(--fill2);color:var(--accent)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick button{border:0;background:#fff;border-radius:10px;padding:12px;text-align:left;box-shadow:0 0 0 .5px rgba(0,0,0,.1);display:flex;gap:10px;align-items:center}
.pick button:hover{box-shadow:0 0 0 2px var(--accent)}
.pick b{display:block;font-weight:600}.pick small{color:var(--sec);font-size:11.5px}
label.fr{cursor:default}
#hud{position:absolute;left:50%;bottom:64px;transform:translateX(-50%) translateY(8px);background:rgba(40,40,42,.92);color:#fff;border-radius:10px;padding:9px 14px;font-size:12.5px;opacity:0;transition:.18s;pointer-events:none;z-index:60;display:flex;gap:8px;align-items:center;max-width:80%}
#hud.on{opacity:1;transform:translateX(-50%)}
#hud svg{width:14px;height:14px;flex:none}
@media (max-width:1040px){.stage{padding:0}.listcol{width:236px}.dpad{padding:6px 18px 30px}.fr .k{min-width:84px}.r .meta .shr{display:none}.abar .cap2{display:none}.abar{justify-content:flex-end}.abar .btn.des{margin-right:auto}}
.sidetoggle{margin-left:auto;border:0;background:none;width:28px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--sec);padding:0}
.sidetoggle:hover{background:var(--fill2)}
.sidetoggle svg{width:17px;height:17px}
.sq{display:grid;place-items:center;color:#fff;font-size:8.5px;font-weight:700;line-height:1}
.win.rail .side{width:56px}
.win.rail .side .chrome{padding:0;justify-content:center;flex-direction:column;gap:10px;height:76px}
.win.rail .lights{gap:5px}.win.rail .lights i{width:9px;height:9px}
.win.rail .sidetoggle{margin:0}
.win.rail .side .scroll{padding:0 8px 6px}
.win.rail .sh,.win.rail .si .lbl,.win.rail .si .cnt,.win.rail .si.l1,.win.rail .si.l2,.win.rail .me .t,.win.rail .side .foot .ib{display:none}
.win.rail .si{justify-content:center;padding:0;height:34px;position:relative}
.win.rail .si svg{width:18px;height:18px}
.win.rail .sq{width:18px;height:18px;border-radius:5px;font-size:10px}
.win.rail .si .bdg{position:absolute;top:2px;right:3px;font-size:9px;min-width:14px;padding:0 3px;line-height:14px}
.win.rail .si.gap,.win.rail .si.sgap{margin-top:12px}
.win.rail .me{justify-content:center;padding:4px 0}
.win.rail .si[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:46px;top:50%;transform:translateY(-50%);background:rgba(40,40,42,.94);color:#fff;font-size:11.5px;padding:3px 8px;border-radius:5px;white-space:nowrap;z-index:50;pointer-events:none}
.win.float .side{position:absolute;left:0;top:0;bottom:0;z-index:35;box-shadow:0 0 0 .5px rgba(0,0,0,.2),12px 0 40px rgba(0,0,0,.18)}
.win.float .listcol{margin-left:56px}
.win.float .scrim{position:absolute;inset:0;z-index:34}
</style>
</head>
<body>
<div class="stage">
<div class="win" id="win">
  <aside class="side" id="side"></aside>
  <section class="listcol" id="list"></section>
  <section class="detail" id="detail"></section>
  <div class="veil" id="veil"><div class="sheet" id="sheet"></div></div>
  <div id="hud"></div>
</div>
</div>
<script>
const ic=(p,extra='')=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" ${extra}>${p}</svg>`;
const I={
  key:ic('<circle cx="7.5" cy="12" r="3.5"/><path d="M11 12h10M17 12v3M20 12v2"/>'),
  folder:ic('<path d="M3.5 7.5a2 2 0 0 1 2-2h3.6l2 2h7.4a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/>'),
  people:ic('<circle cx="9" cy="8.5" r="3.2"/><path d="M3 19c.8-3.2 3.2-5 6-5s5.2 1.8 6 5"/><circle cx="17" cy="9.5" r="2.4"/><path d="M16.5 14.2c2.3.2 3.8 1.6 4.5 4.3"/>'),
  check:ic('<path d="M5 12.5l4.5 4.5L19 7.5"/>','stroke-width="2.6"'),
  checkc:ic('<circle cx="12" cy="12" r="9"/><path d="M8 12.3l2.8 2.8L16.2 9.5"/>'),
  agent:ic('<rect x="4.5" y="7" width="15" height="12" rx="3"/><path d="M12 3.5V7M9.5 12.5v1M14.5 12.5v1"/>'),
  gear:ic('<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>','stroke-width="1.6"'),
  plus:ic('<path d="M12 5v14M5 12h14"/>','stroke-width="2"'),
  search:ic('<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>','stroke-width="2"'),
  share:ic('<path d="M12 15V4M8 7.5L12 4l4 3.5"/><path d="M7 11H6a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2h-1"/>'),
  more:ic('<circle cx="6" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18" cy="12" r="1.3"/>','fill="currentColor"'),
  person:ic('<circle cx="12" cy="8.5" r="3.6"/><path d="M5 20c1.2-3.8 3.8-5.5 7-5.5s5.8 1.7 7 5.5"/>','stroke-width="2.4"'),
  x:ic('<path d="M7 7l10 10M17 7L7 17"/>','stroke-width="2.6"'),

      <div class="hdr">${ava(d.agent,'l')}<div><h1>${esc(d.member?d.member+'’s '+a.name:a.name)} wants to use ${esc(it.name)}</h1><div class="s">${esc(d.project)} · <span class="tm" data-timer2="${d.id}">${fmt(d.secs)}</span> left to answer</div></div></div>
      <div class="grp">
        <div class="fr"><div class="k">Credential</div><div class="v" style="display:flex;justify-content:flex-end;align-items:center;gap:8px;color:var(--label)">${tile(it.pv,'s')}${esc(it.name)}${prod?'<span class="cap red">Production</span>':''}</div></div>
        ${frow('Action',d.action)}
        ${frow('Project',esc(d.project))}
        ${frow('Sends to',esc(d.host))}
        ${d.member?frow('Asked by',esc(d.member)+', Acme team'):''}
      </div>
      <div class="gl">Command</div>
      <div class="grp"><div class="fr"><div class="cmd">${esc(d.cmd)}</div></div></div>
      <div class="gl">Why you are asked</div>
      <div class="grp"><div class="fr"><div class="v l">${esc(d.why)}</div></div></div>
    </div></div>
    <div class="abar"><button class="btn des" data-a="decide" data-c="deny">Deny</button><div class="cap2">Allow is remembered for all agents in ${esc(d.project)}. Also on your iPhone.</div><button class="btn" data-a="decide" data-c="once">Allow Once</button><button class="btn pri" data-a="decide" data-c="allow">${esc(allow)}</button></div>`;
  }
  if(d.t==='req'){const a=AG[d.agent];return `<div class="tb"></div><div class="dscroll"><div class="dpad">
      <div class="hdr">${ava(d.agent,'l')}<div><h1>${esc(a.name)} asks for a ${esc(d.name)}</h1><div class="s">${esc(d.project)}</div></div></div>
      <div class="grp">${frow('For',esc(d.purpose))}${frow('Get it at',`<span style="color:var(--accent)">${esc(d.where)} ↗</span>`)}${frow('Saves to','Side projects')}</div>
      <div class="gl">Key</div>
      <textarea class="field mono" rows="3" id="reqv" placeholder="Paste the key"></textarea>
      <div class="note">${esc(a.name)} never sees the value. It can use the key as soon as you save it.</div>
    </div></div>
    <div class="abar"><div class="cap2"></div><button class="btn" data-a="decide" data-c="dismiss">Not Now</button><button class="btn pri" data-a="fulfil">Save</button></div>`}
  const it=item(d.item);
  return `<div class="tb"></div><div class="dscroll"><div class="dpad">
    <div class="hdr">${tile(it.pv,'l')}<div><h1>${esc(d.q)}</h1><div class="s">Apassy noticed this from how agents use it.</div></div></div>
    <div class="grp">${d.facts.map(f=>frow(f[0],esc(f[1]))).join('')}</div>
    <div class="note">Until you answer, the bouncer treats it as production and asks more often.</div>
  </div></div>
  <div class="abar"><button class="btn" data-a="decide" data-c="dismiss">Ignore</button><div class="cap2"></div><button class="btn" data-a="fix" data-v="prod">Production</button><button class="btn pri" data-a="fix" data-v="dev">Development</button></div>`;
}
function detailAgent(){
  const id=S.sel.agents,a=AG[id];
  const ex=[...(S.exc[id]||[]).map(i=>({i,t:'Never: '})),...(S.askAlways[id]||[]).map(i=>({i,t:'Always ask: '}))];
  return `<div class="tb"></div><div class="dscroll"><div class="dpad">
    <div class="hdr">${ava(id,'l')}<div><h1>${esc(a.name)}</h1><div class="s">${esc(a.where)} · connected Oct 9</div>${a.where==='Remote'?'<div class="caps"><span class="cap">Remote · the bouncer asks more often</span></div>':''}</div></div>
    <div class="grp">${frow('Uses this week',a.uses)}${frow('Projects',esc(a.projects))}${frow('Sees','Credential names, never values')}</div>
    <div class="gl">Note for the bouncer</div>
    <textarea class="field" rows="2" placeholder="Optional. For example: CI agent for Acme, only the Stripe test key.">${esc(a.note)}</textarea>
    <div class="gl">Exceptions</div>
    <div class="grp">${ex.length?ex.map(e=>`<div class="fr"><div style="flex:1;display:flex;align-items:center;gap:8px">${tile(item(e.i).pv,'s')}${e.t}${esc(item(e.i).name)}</div><button class="pb" data-a="rmagexc" data-i="${e.i}">Remove</button></div>`).join(''):'<div class="fr"><div class="v l" style="color:var(--sec)">None. Exceptions come from your answers in Decisions.</div></div>'}</div>
    <div class="grp" style="margin-top:22px"><div class="fr click" data-a="noop"><div class="k" style="color:var(--red)">Disconnect ${esc(a.name)}…</div><div class="v"></div></div></div>
  </div></div>`;
}

function isNarrow(){return document.querySelector('#win').clientWidth<1000}
function isRail(){return S.sideOpen===null?isNarrow():!S.sideOpen}
function layout(){const w=$('#win'),rail=isRail();w.classList.toggle('rail',rail);w.classList.toggle('float',!rail&&isNarrow());let sc=w.querySelector('.scrim');if(!rail&&isNarrow()){if(!sc){sc=document.createElement('div');sc.className='scrim';sc.dataset.a='closeside';w.appendChild(sc)}}else if(sc)sc.remove()}
window.addEventListener('resize',()=>{render()});
function render(){
  layout();
  side();
  const v=S.view;
  $('#list').innerHTML=v==='vault'?listVault():v==='shared'?listShared():v==='decisions'?listDecisions():listAgents();
  $('#detail').innerHTML=v==='vault'||v==='shared'?detailCred():v==='decisions'?detailDecision():detailAgent();
}
function firstIn(view){
  if(view==='vault'){const l=S.items.filter(i=>inF(i,S.folder)).sort((a,b)=>a.folder.localeCompare(b.folder));return l[0]?.id}
  if(view==='shared'){const m=S.items.filter(i=>i.shared.includes(S.shared));return (m[0]||S.others.find(o=>o.vault===S.shared))?.id}
}
function sheet(h,cls=''){$('#sheet').className='sheet '+cls;$('#sheet').innerHTML=h;$('#veil').classList.add('on')}
function closeSheet(){$('#veil').classList.remove('on')}
const PROV=[[/^sk-ant-/,'Anthropic','ANTHROPIC_API_KEY','api.anthropic.com'],[/^(ghp_|github_pat_)/,'GitHub','GITHUB_TOKEN','api.github.com'],[/^(sk|rk)_live_/,'Stripe','STRIPE_SECRET_KEY','api.stripe.com','prod'],[/^(sk|rk)_test_/,'Stripe','STRIPE_SECRET_KEY','api.stripe.com','dev'],[/^AKIA/,'AWS','AWS_ACCESS_KEY_ID','amazonaws.com'],[/^sk-/,'OpenAI','OPENAI_API_KEY','api.openai.com'],[/^re_/,'Resend','RESEND_API_KEY','api.resend.com'],[/^sntrys_/,'Sentry','SENTRY_AUTH_TOKEN','sentry.io'],[/^xox[bp]-/,'Slack','SLACK_BOT_TOKEN','slack.com']];
const tcase=k=>k.toLowerCase().split('_').filter(Boolean).map(w=>w[0].toUpperCase()+w.slice(1)).join(' ');
function dv(v,key){for(const [re,pv,env,host,et] of PROV)if(re.test(v)){let e=et||'unk';if(key&&/PROD|LIVE/.test(key))e='prod';return {name:pv==='Stripe'?(e==='prod'?'Stripe live':'Stripe test'):pv+(pv==='GitHub'?' token':' API'),pv,env:key||env,host,envt:e,kind:'API key'}}
  return {name:key?tcase(key):'Credential',pv:'Custom',env:key||'CREDENTIAL',host:'',envt:key&&/PROD|LIVE/.test(key)?'prod':'unk',kind:'Secret'}}
function detect(t){t=t.trim();if(!t)return[];
  if(/^otpauth:/.test(t))return [{name:decodeURIComponent((t.match(/totp\/([^?]+)/)||[,'Account'])[1]),pv:'One-time code',env:'—',host:'',envt:'unk',kind:'One-time code'}];
  const m=t.match(/^(postgres(?:ql)?|mysql|redis):\/\/([^:@\/]+)(?::[^@]*)?@([^\/:?]+)[^\/]*\/?([^?]*)/);
  if(m)return [{name:(m[4]?tcase(m[4])+' ':'')+'database',pv:'Postgres',env:'DATABASE_URL',host:m[3],envt:/prod/.test(m[3])?'prod':'unk',kind:'Database',user:m[2]}];
  const ls=t.split('\n').map(l=>l.trim()).filter(l=>l&&!l.startsWith('#'));
  if(ls.length&&ls.every(l=>/^(export\s+)?[A-Za-z_]\w*\s*=/.test(l)))return ls.map(l=>{const mm=l.replace(/^export\s+/,'').match(/^(\w+)\s*=\s*["']?(.*?)["']?$/);return dv(mm[2],mm[1].toUpperCase())});
  return [dv(t)]}
const EX={key:'sk-ant-api03-FAKE0000000000000000',env:'# .env\nRESEND_API_KEY=re_FAKE123\nSTRIPE_SECRET_KEY=sk_test_FAKE51H\nSENTRY_AUTH_TOKEN=sntrys_FAKE\nDATABASE_PASSWORD=fake-pass',url:'postgres://billing_rw:FAKE@db.prod.acme.internal:5432/billing'};
let DET=[];
function pasteSheet(){
  const opts=['',...allF().map(f=>f.id)].map(id=>`<option value="${id}" ${id===(S.folder||'')?'selected':''}>${esc(fpath(id||null))}</option>`).join('');
  sheet(`<h2>New Credential</h2><p class="lead">Paste a key, a .env file, a database URL, or an otpauth:// link.</p>
    <textarea class="field mono" rows="4" id="pbox" placeholder="⌘V"></textarea>
    <div class="ex">Examples:<button data-a="ex" data-v="key">API key</button><button data-a="ex" data-v="env">.env file</button><button data-a="ex" data-v="url">Database URL</button></div>
    <div id="det" style="margin-top:12px"></div>
    <div class="sbar"><span class="left">Folder <select id="pf" class="pop">${opts}</select></span><button class="btn" data-a="close">Cancel</button><button class="btn pri" data-a="savepaste" id="sv" disabled>Add</button></div>`);
  $('#pbox').focus();$('#pbox').addEventListener('input',upd);upd();
}
function upd(){DET=detect($('#pbox').value);const b=$('#sv');b.disabled=!DET.length;b.textContent=DET.length>1?`Add ${DET.length}`:'Add';
  $('#det').innerHTML=DET.length?`<div class="grp">${DET.map((d,i)=>`<div class="dt">${DET.length>1?`<input type="checkbox" checked class="dchk" data-i="${i}">`:''}${tile(d.pv)}<div style="flex:1;min-width:0"><input type="text" class="dname" data-i="${i}" value="${esc(d.name)}"><small>${esc(d.pv==='Custom'?'Secret':d.pv)} · <span class="mono">${esc(d.env)}</span>${d.host?' · '+esc(d.host):''}</small></div>${d.envt==='prod'?'<span class="cap red">Production</span>':d.envt==='dev'?'<span class="cap">Development</span>':''}</div>`).join('')}</div><div class="note">Everything else is set automatically.</div>`:''}
function prefsSheet(){
  const tabs=[['general','General',I.gear],['devices','Devices',I.laptop],['security','Security',I.lock],['advanced','Advanced',I.sliders]];
  const g=(t,rows)=>`<div class="gl">${t}</div><div class="grp">${rows}</div>`;
  const b={
    general:g('Vault',frow('Personal','On this Mac · iCloud Drive'))+g('Import',`<div class="fr"><div class="k">1Password, Bitwarden, .env</div><div class="v"></div><button class="pb">Import…</button></div>`)+g('Browser',frow('Chrome extension','Installed')),
    devices:g('Questions go to every device',`${frow('Mac mini','This Mac')}${frow('MacBook Pro','Online')}${frow('iPhone','Push · Face ID')}<div class="fr"><div class="k">Relay</div><div class="v">End-to-end encrypted</div><button class="sw on" data-a="sw"></button></div>`)+`<div style="margin-top:10px"><button class="btn">Add Device…</button></div>`,
    security:g('Unlock',`<div class="fr"><div class="k">Touch ID</div><div class="v"></div><button class="sw on" data-a="sw"></button></div>${frow('Passphrase','Changed Sep 26')}${frow('Lock after','15 minutes')}`)+g('Backup',`<div class="fr"><div class="k">Last backup</div><div class="v">Today 09:12</div><button class="pb">Back Up Now</button></div>`),
    advanced:g('Bouncer',`${frow('Model','Running')}${frow('Asked you','4 times this week')}`)+g('Command line',frow('apassy','/usr/local/bin'))+g('Updates',frow('Version','Automatic')),
  }[S.ptab];
  sheet(`<div class="ptabs">${tabs.map(([k,l,i])=>`<button class="${S.ptab===k?'on':''}" data-a="ptab" data-v="${k}">${i}${l}</button>`).join('')}</div>${b}<div class="sbar"><button class="btn pri" data-a="close">Done</button></div>`,'prefs');
}
function membersSheet(){const v=S.shares.find(x=>x.id===S.shared);
  sheet(`<h2>${esc(v.name)}</h2><p class="lead">Their agents can use the items here. The bouncer decides each use.</p>
  <div class="grp">${v.members.map(m=>`<div class="fr"><div style="display:flex;align-items:center;gap:8px;flex:1"><div class="ava s" style="background:${m[2]}">${m[0][0]}</div>${m[0]}</div><span class="pop">${m[1]}</span></div>`).join('')}</div>
  <div class="note">Members use items through their agents. Managers and owners can also see values.</div>
  <div class="sbar"><span class="left"><button class="btn" data-a="noop">Invite…</button></span><button class="btn pri" data-a="close">Done</button></div>`)}
function shareSheet(){const it=item(S.sel.vault);if(!it||it.from)return;
  sheet(`<h2>Share “${esc(it.name)}”</h2><p class="lead">It stays in ${esc(fpath(it.folder))}. A shared vault gets the same item, not a copy.</p>
  <div class="grp">${S.shares.map(v=>`<label class="fr"><span class="sq" style="background:${v.color}"></span><div style="flex:1">${esc(v.name)}<div style="font-size:12px;color:var(--sec)">${v.members.map(m=>m[0]).join(', ')}</div></div><input type="checkbox" class="schk" value="${v.id}" ${it.shared.includes(v.id)?'checked':''}></label>`).join('')}</div>
  <div class="sbar"><span class="left">Touch ID</span><button class="btn" data-a="close">Cancel</button><button class="btn pri" data-a="saveshare">Share</button></div>`)}
function moveSheet(){const it=item(S.sel.vault);if(!it||it.from)return;
  sheet(`<h2>Move “${esc(it.name)}”</h2><p class="lead">Sharing does not change.</p><div class="grp">${['',...allF().map(f=>f.id)].map(id=>`<label class="fr"><div style="flex:1;padding-left:${id?id.split('/').length*14:0}px;display:flex;align-items:center;gap:6px"><span style="color:var(--accent);display:inline-grid;width:15px">${I.folder}</span>${esc(id?fpath(id).split(' › ').pop():'Personal')}</div><input type="radio" name="mv" value="${id}" ${id===it.folder?'checked':''}></label>`).join('')}</div>
  <div class="sbar"><button class="btn" data-a="close">Cancel</button><button class="btn pri" data-a="savemove">Move</button></div>`)}
function connectSheet(){sheet(`<h2>Connect an Agent</h2><p class="lead">Apassy sets up the host. There is nothing else to configure.</p>
  <div class="pick">${[['Claude Code','#d97757','MCP server'],['Codex','#10a37f','MCP server'],['T3 Code','#6e5ae6','Through Claude Code or Codex'],['Other','#8e8e93','Token and CLI, also remote']].map(([n,c,s])=>`<button data-a="host" data-v="${n}"><div class="ava" style="background:${c}">${n[0]}</div><div><b>${n}</b><small>${s}</small></div></button>`).join('')}</div>
  <div class="sbar"><button class="btn" data-a="close">Cancel</button></div>`)}

function doneDecision(msg){const ids=S.decs.map(d=>d.id);const i=ids.indexOf(S.sel.decisions);S.decs=S.decs.filter(d=>d.id!==S.sel.decisions);S.decided++;S.menu=null;S.sel.decisions=(S.decs[Math.min(i,S.decs.length-1)]||{}).id;render();hud(msg)}
document.addEventListener('click',e=>{
  if(e.target.id==='veil'){closeSheet();return}
  const el=e.target.closest('[data-a]');
  if(!el){if(S.menu){S.menu=null;render()}return}
  const a=el.dataset.a,id=el.dataset.id;
  if(isNarrow()&&S.sideOpen&&['folder','shared','view'].includes(a))S.sideOpen=null;
  if(a!=='imenu'&&a!=='dmenu'&&S.menu&&!el.closest('.menu'))S.menu=null;
  switch(a){
    case 'sidetoggle':S.sideOpen=isRail();return render();
    case 'closeside':S.sideOpen=null;return render();
    case 'tw':e.stopPropagation();S.open[id]=!S.open[id];return side();
    case 'folder':S.view='vault';S.folder=id||null;{const cur=S.items.find(i=>i.id===S.sel.vault);if(!cur||!inF(cur,S.folder))S.sel.vault=firstIn('vault')}return render();
    case 'shared':S.view='shared';S.shared=id;S.sel.vault=firstIn('shared');return render();
    case 'view':S.view=el.dataset.v;if(S.view==='decisions'&&!S.decs.find(d=>d.id===S.sel.decisions))S.sel.decisions=S.decs[0]?.id;return render();
    case 'sel':S.sel.vault=+id;return render();
    case 'dsel':S.sel.decisions=id;S.menu=null;return render();
    case 'asel':S.sel.agents=id;return render();
    case 'imenu':S.menu=S.menu==='item'?null:'item';return render();
    case 'dmenu':S.menu=S.menu==='dec'?null:'dec';return render();
    case 'paste':return pasteSheet();
    case 'ex':$('#pbox').value=EX[el.dataset.v];return upd();
    case 'close':return closeSheet();
    case 'savepaste':{const f=$('#pf').value;const ch=DET.map((d,i)=>({...d,name:document.querySelector(`.dname[data-i="${i}"]`).value,on:(document.querySelector(`.dchk[data-i="${i}"]`)||{checked:true}).checked})).filter(d=>d.on);if(!ch.length)return;let last;for(const d of ch){last=S.next++;S.items.push({id:last,name:d.name,pv:d.pv,kind:d.kind,env:d.env,host:d.host,envt:d.envt,folder:f,shared:[],user:d.user})}closeSheet();S.view='vault';S.folder=f||null;S.sel.vault=last;render();return hud(ch.length>1?`Added ${ch.length} credentials`:`Added ${ch[0].name}`)}
    case 'share':S.menu=null;render();return shareSheet();
    case 'saveshare':{const it=item(S.sel.vault);it.shared=[...document.querySelectorAll('.schk')].filter(c=>c.checked).map(c=>c.value);closeSheet();render();return hud(it.shared.length?'Shared':'No longer shared')}
    case 'move':S.menu=null;render();return moveSheet();
    case 'savemove':{const it=item(S.sel.vault);it.folder=document.querySelector('input[name=mv]:checked').value;closeSheet();render();return hud('Moved to '+fpath(it.folder||null))}
    case 'members':return membersSheet();
    case 'addshare':return hud('Use Share… on any credential to add it here');
    case 'prefs':return prefsSheet();
    case 'ptab':S.ptab=el.dataset.v;return prefsSheet();
    case 'connect':return connectSheet();
    case 'host':closeSheet();return hud(`${el.dataset.v} connected`);
    case 'newfolder':{const n=prompt('Folder name','Clients');if(!n)return;const f={id:n.toLowerCase().replace(/\W+/g,'-'),name:n,kids:[]};S.folders.push(f);S.view='vault';S.folder=f.id;S.sel.vault=null;return render()}
    case 'newshare':{const n=prompt('Shared vault name','Client X');if(!n)return;const v={id:n.toLowerCase().replace(/\W+/g,'-'),name:n,color:'#ff9f0a',members:[['Rafal','Owner','#ff9500']]};S.shares.push(v);S.view='shared';S.shared=v.id;S.sel.vault=null;return render()}
    case 'envt':{item(S.sel.vault).envt=el.dataset.v;render();return hud('Saved')}
    case 'show':return hud('Shown for 20 seconds after Touch ID');
    case 'edit':return hud('Edit shows every field, for those who want it');
    case 'sw':el.classList.toggle('on');return;
    case 'rmrule':{S.rules[S.sel.vault].splice(+el.dataset.i,1);render();return hud('Rule removed')}
    case 'rmexc':{const g=el.dataset.ag,i=S.sel.vault;S.exc[g]=(S.exc[g]||[]).filter(x=>x!==i);S.askAlways[g]=(S.askAlways[g]||[]).filter(x=>x!==i);render();return hud('Exception removed')}
    case 'rmagexc':{const g=S.sel.agents,i=+el.dataset.i;S.exc[g]=(S.exc[g]||[]).filter(x=>x!==i);S.askAlways[g]=(S.askAlways[g]||[]).filter(x=>x!==i);render();return hud('Exception removed')}
    case 'decide':{const d=S.decs.find(x=>x.id===S.sel.decisions);const c=el.dataset.c;
      return doneDecision({allow:`Remembered for all agents in ${d.project}`,once:'Allowed once',deny:'Denied',never:'Saved as an exception',askall:'Saved as an exception',disc:'Agent disconnected',dismiss:'Dismissed'}[c])}
    case 'fulfil':{const v=$('#reqv').value.trim();if(!v)return hud('Paste the key first');const d=S.decs.find(x=>x.id===S.sel.decisions);S.items.push({id:S.next++,name:d.name,pv:'Resend',kind:'API key',env:'RESEND_API_KEY',host:'api.resend.com',envt:'unk',folder:'side',shared:[]});return doneDecision('Saved. Codex can use it now.')}
    case 'fix':{const d=S.decs.find(x=>x.id===S.sel.decisions);item(d.item).envt=el.dataset.v;return doneDecision('Saved')}
    case 'noop':S.menu=null;render();return;
  }
});
setInterval(()=>{for(const d of S.decs)if(d.secs>0){d.secs--;document.querySelectorAll(`[data-timer="${d.id}"],[data-timer2="${d.id}"]`).forEach(t=>t.textContent=fmt(d.secs))}},1000);
render();
