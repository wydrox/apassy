<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apassy · kompaktowe nagłówki</title><style>
*{box-sizing:border-box}body{margin:0;color:var(--foreground,#171717);font-family:var(--font-sans,system-ui,sans-serif)}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}label{font-weight:600}select{font:inherit;min-height:44px;max-width:100%;padding:8px 12px;border:1px solid var(--border,#ccc);border-radius:10px;background:var(--card,#fff);color:inherit}p{font-size:14px;line-height:1.5;margin:12px 0;color:var(--muted-foreground,#666)}figure{margin:0}img{display:block;width:100%;max-width:320px;height:auto;margin:0 auto;border-radius:20px}.evidence{font-size:12px;text-align:center;margin-top:14px}button,select:focus-visible{outline:2px solid var(--ring,#08f);outline-offset:3px}
</style><div class="controls"><label for="screen">Ekran</label><select id="screen" aria-label="Wybierz ekran"></select></div><p id="note" aria-live="polite"></p><figure><img id="shot" width="1170" height="2532" alt=""></figure><p class="evidence">Natywna aplikacja · iPhone 17e / iOS 27 · dane syntetyczne · 19.10.2026</p><script>
const screens=[{"name": "Requests · Waiting", "src": "screenshots/compact-waiting-light-2026-10-19.png", "note": "Bez dużego tytułu. Pasek akcji, przełącznik i lista."}, {"name": "Requests · History", "src": "screenshots/compact-history-light-2026-10-19.png", "note": "Ten sam układ paska i przełącznika co w Waiting."}, {"name": "Vault", "src": "screenshots/compact-vault-2026-10-19.png", "note": "Nazwa aktywnego sejfu z natywnym selektorem."}, {"name": "Wybór sejfu", "src": "screenshots/compact-vault-selector-2026-10-19.png", "note": "Przełączenie prowadzi przez zwykłe odblokowanie."}, {"name": "Search", "src": "screenshots/compact-search-empty-2026-10-19.png", "note": "Pole wyszukiwania bez powtórzonego nagłówka."}, {"name": "Wyniki Search", "src": "screenshots/compact-search-results-2026-10-19.png", "note": "Wyniki i powrót ze szczegółów zachowują zapytanie."}, {"name": "Szczegóły", "src": "screenshots/compact-credential-detail-2026-10-19.png", "note": "Mały tytuł w pasku i kompaktowe informacje o usłudze."}, {"name": "Folder", "src": "screenshots/compact-folder-2026-10-19.png", "note": "Kontekstowy tytuł i natywny powrót."}, {"name": "Nowe poświadczenie", "src": "screenshots/compact-form-2026-10-19.png", "note": "Kompaktowy tytuł formularza z zamknięciem."}, {"name": "Waiting · ciemny", "src": "screenshots/compact-waiting-dark-2026-10-19.png", "note": "Natywny tryb ciemny."}, {"name": "History · ciemny", "src": "screenshots/compact-history-dark-2026-10-19.png", "note": "Ta sama geometria również w trybie ciemnym."}, {"name": "Duży tekst · selektor", "src": "screenshots/compact-vault-accessibility-2026-10-19.png", "note": "Selektor pozostaje dostępny przy największym rozmiarze tekstu."}];const select=document.getElementById('screen'),image=document.getElementById('shot'),note=document.getElementById('note');screens.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=s.name;select.append(o)});function show(){const s=screens[select.value];image.src=s.src;image.alt=s.name+' — natywny zrzut aplikacji Apassy';note.textContent=s.note}select.addEventListener('change',show);show();window.addEventListener('load',()=>console.log(JSON.stringify({screens:screens.length,overflow:document.documentElement.scrollWidth>innerWidth,imageLoaded:image.complete&&image.naturalWidth>0})))
</script></html>
