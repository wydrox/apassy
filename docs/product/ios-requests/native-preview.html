<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{margin:0;color:var(--foreground);font:14px var(--font-sans,system-ui)}p{margin:0 0 12px;color:var(--muted-foreground)}nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}button{font:inherit;padding:10px 12px;min-height:44px;border:1px solid var(--border);border-radius:var(--radius,10px);background:var(--secondary);color:var(--foreground);cursor:pointer}button[aria-pressed=true]{background:var(--primary);color:var(--primary-foreground)}button:focus-visible{outline:2px solid var(--ring);outline-offset:2px}figure{margin:0}figure[hidden]{display:none}img{display:block;width:100%;max-width:280px;height:auto;margin:0 auto;border-radius:22px}figcaption{text-align:center;color:var(--muted-foreground);margin-top:10px}
</style></head><body><p>Natywne SwiftUI · rzeczywiste zrzuty z Simulatora · dane syntetyczne</p><nav aria-label="Zrzuty aplikacji"><button type="button" aria-pressed="true" aria-controls="shot-0" data-index="0">Lista · jasna</button><button type="button" aria-pressed="false" aria-controls="shot-1" data-index="1">Lista · ciemna</button><button type="button" aria-pressed="false" aria-controls="shot-2" data-index="2">Historia</button><button type="button" aria-pressed="false" aria-controls="shot-3" data-index="3">Szczegóły</button><button type="button" aria-pressed="false" aria-controls="shot-4" data-index="4">Duży tekst</button></nav><figure id="shot-0" ><img src="screenshots/native-waiting-light.png" alt="Apassy Requests: Lista · jasna"><figcaption>Lista · jasna</figcaption></figure><figure id="shot-1" hidden><img src="screenshots/native-waiting-dark.png" alt="Apassy Requests: Lista · ciemna"><figcaption>Lista · ciemna</figcaption></figure><figure id="shot-2" hidden><img src="screenshots/native-history.png" alt="Apassy Requests: Historia"><figcaption>Historia</figcaption></figure><figure id="shot-3" hidden><img src="screenshots/native-history-detail.png" alt="Apassy Requests: Szczegóły"><figcaption>Szczegóły</figcaption></figure><figure id="shot-4" hidden><img src="screenshots/native-accessibility-text.png" alt="Apassy Requests: Duży tekst"><figcaption>Duży tekst</figcaption></figure><script>document.querySelectorAll('button').forEach(b=>b.onclick=()=>{document.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.querySelectorAll('figure').forEach((f,i)=>f.hidden=i!==Number(b.dataset.index));});console.log('Native screenshot gallery: 5 states');</script></body></html>
