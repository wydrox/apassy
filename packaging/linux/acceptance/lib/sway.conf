# Headless sway for the Wayland checks of the acceptance kit (lib/wayland.sh).
output HEADLESS-1 resolution 1600x1000 position 0 0
default_border none
focus_follows_mouse no
# Tell the kit which socket this sway serves.
exec sh -c 'mkdir -p /tmp/l4 && printf "WAYLAND_DISPLAY=%s\nSWAYSOCK=%s\n" "$WAYLAND_DISPLAY" "$SWAYSOCK" > /tmp/l4/sway.env'
