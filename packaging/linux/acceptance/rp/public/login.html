<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>L4 login</title><link rel="stylesheet" href="/style.css"></head>
<body><main>
<h1>L4 login</h1>
<p class="note">Synthetic account synthetic.login@example.test.</p>
<form id="login" autocomplete="on">
  <label>Username <input id="username" name="username" type="email" autocomplete="username"></label>
  <label>Password <input id="password" name="password" type="password" autocomplete="current-password"></label>
  <button type="submit" id="submit">Sign in</button>
</form>
<p id="status" role="status" data-state="idle">Ready.</p>
</main><script src="/login.js" type="module"></script></body></html>
