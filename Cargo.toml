[package]
name = "apassy"
version = "0.3.4"
edition = "2024"
rust-version = "1.97"
publish = false
license = "Apache-2.0"
repository = "https://github.com/wydrox/apassy"
description = "A personal credential manager with controlled agent access"

[features]
default = []
desktop = ["dep:eframe", "dep:rustix", "dep:rfd", "dep:qrcode"]
storage-probe = ["dep:rusqlite", "dep:tempfile"]
vault = ["dep:rusqlite", "dep:tempfile", "dep:getrandom", "dep:rustls", "dep:rustls-platform-verifier", "dep:rcgen", "dep:time", "dep:ring", "dep:flate2"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
zeroize = "=1.9.0"
eframe = { version = "=0.36.2", optional = true, default-features = false, features = ["accesskit", "default_fonts", "glow"] }
# Native open/save panels. The async API keeps the desktop event loop free.
rfd = { version = "=0.17.2", optional = true, default-features = false, features = ["xdg-portal"] }
rusqlite = { version = "=0.40.2", optional = true, default-features = false, features = ["bundled-sqlcipher-vendored-openssl"] }
tempfile = { version = "=3.27.0", optional = true }
getrandom = { version = "=0.4.3", optional = true }
# ADR 0005: TLS for connector destinations. ring backend, macOS trust store.
rustls = { version = "=0.23.45", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = { version = "=0.7.0", optional = true }
# ADR 0011: the certificate authority of each proxied run and its host certificates.
rcgen = { version = "=0.14.10", optional = true, default-features = false, features = ["crypto", "pem", "ring"] }
# ADR 0020: ECDSA P-256 verification, HMAC-SHA256, and SHA-256 for the iPhone companion.
# The version and the features are the ones that rustls and rcgen already build.
ring = { version = "=0.17.14", optional = true, default-features = false, features = ["alloc"] }
# ADR 0020: the pairing QR code of the desktop app. No default features, so no `image`
# and no other dependency. The app draws the modules with egui.
qrcode = { version = "=0.14.1", optional = true, default-features = false }
time = { version = "=0.3.47", optional = true, default-features = false, features = ["std"] }
# 0.3.0: the zip archive of a 1Password export (.1pux). The version that png already uses.
flate2 = { version = "=1.1.10", optional = true, default-features = false, features = ["rust_backend"] }
# Key-memory review F6: safe setrlimit for the core-dump limit of the desktop
# process. The same version is already in Cargo.lock through tempfile. `termios`:
# the owner command line turns off the echo when it reads a secret (ADR 0017).
rustix = { version = "=1.1.4", optional = true, default-features = false, features = ["std", "process", "termios"] }

[[bin]]
name = "apassy"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "apassy-mcp"
path = "src/bin/apassy-mcp.rs"

[[bin]]
name = "apassy-hook"
path = "src/bin/apassy-hook.rs"

[[bin]]
name = "apassy-dev-reporting"
path = "src/bin/apassy-dev-reporting.rs"

[[bin]]
name = "apassy-sandbox"
path = "src/bin/apassy-sandbox.rs"

# Held-out evaluation harness (goal B2). Needs the vault feature and a live Laya
# server. It is not part of `cargo test`.
[[bin]]
name = "apassy-eval"
path = "src/bin/apassy-eval.rs"
required-features = ["vault"]

[[bin]]
name = "apassy-packs"
path = "src/bin/apassy-packs.rs"
required-features = ["vault"]

# Label export for the base-model data generator (goal B8, tools/basemodel/).
# It runs the command analysis on generated commands. It is not shipped.
[[example]]
name = "basemodel_labels"
path = "examples/basemodel_labels.rs"
required-features = ["vault"]

# Screenshots for the README and the site (scripts/screenshots.sh). Synthetic data.
[[example]]
name = "screenshots"
path = "examples/screenshots.rs"
required-features = ["desktop", "vault"]

# A development server for the iPhone companion (ADR 0020). It makes a synthetic vault in
# a temporary directory and speaks a line protocol on stdin and stdout, for the interop
# test with the Swift client. It is not shipped.
[[example]]
name = "companion_dev"
path = "examples/companion_dev.rs"
required-features = ["vault"]

[[test]]
name = "sqlcipher_probe"
path = "tests/sqlcipher_probe.rs"
required-features = ["storage-probe"]

[[test]]
name = "vault_lifecycle"
path = "tests/vault_lifecycle.rs"
required-features = ["vault"]

[[test]]
name = "bouncer_rules"
path = "tests/bouncer_rules.rs"
required-features = ["vault"]

[[test]]
name = "agent_run"
path = "tests/agent_run.rs"
required-features = ["vault"]

[[test]]
name = "agent_path"
path = "tests/agent_path.rs"
required-features = ["vault"]

[[test]]
name = "access_model"
path = "tests/access_model.rs"
required-features = ["vault"]

[[test]]
name = "run_proxy"
path = "tests/run_proxy.rs"
required-features = ["vault"]

[[test]]
name = "vault_passphrase"
path = "tests/vault_passphrase.rs"
required-features = ["vault"]

[[test]]
name = "host_hook"
path = "tests/host_hook.rs"
required-features = ["vault"]

[[test]]
name = "companion"
path = "tests/companion.rs"
required-features = ["vault"]

[[test]]
name = "onepassword_import"
path = "tests/onepassword_import.rs"
required-features = ["vault"]

[[test]]
name = "isolation_profile"
path = "tests/isolation/product_profile.rs"
required-features = ["vault"]

[[test]]
name = "folder_sync"
path = "tests/folder_sync.rs"
required-features = ["vault"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

# Keep target/ small: line tables are enough for backtraces with file:line,
# and dependencies need no debug info at all.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[dev-dependencies]
# Source-bound TCP tests use native sockets, not platform-specific netcat processes.
socket2 = { version = "=0.6.3", default-features = false }
