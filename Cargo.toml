[package]
name = "apassy"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "A personal credential manager with controlled agent access"

[features]
default = []
desktop = ["dep:eframe"]
storage-probe = ["dep:rusqlite", "dep:tempfile"]
vault = ["dep:rusqlite", "dep:tempfile", "dep:getrandom", "dep:rustls", "dep:rustls-platform-verifier"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
eframe = { version = "=0.36.2", optional = true, default-features = false, features = ["accesskit", "default_fonts", "glow"] }
rusqlite = { version = "=0.40.2", optional = true, default-features = false, features = ["bundled-sqlcipher-vendored-openssl"] }
tempfile = { version = "=3.27.0", optional = true }
getrandom = { version = "=0.4.3", optional = true }
# ADR 0005: TLS for connector destinations. ring backend, macOS trust store.
rustls = { version = "=0.23.44", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = { version = "=0.7.0", optional = true }

[[bin]]
name = "apassy"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "apassy-mcp"
path = "src/bin/apassy-mcp.rs"

[[bin]]
name = "apassy-dev-reporting"
path = "src/bin/apassy-dev-reporting.rs"

[[test]]
name = "sqlcipher_probe"
path = "tests/sqlcipher_probe.rs"
required-features = ["storage-probe"]

[[test]]
name = "vault_lifecycle"
path = "tests/vault_lifecycle.rs"
required-features = ["vault"]

[[test]]
name = "agent_run"
path = "tests/agent_run.rs"
required-features = ["vault"]

[[test]]
name = "agent_path"
path = "tests/agent_path.rs"
required-features = ["vault"]

[[test]]
name = "vault_passphrase"
path = "tests/vault_passphrase.rs"
required-features = ["vault"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
