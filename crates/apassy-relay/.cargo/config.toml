# Build settings for every cargo command in this repository.
#
# The same SQLCipher flags as the core repository (wydrox/apassy,
# .cargo/config.toml). A dependent does not get the config of a dependency, so
# this copy is required. Without it the core `Vault` and the team vault refuse to
# open (they check `PRAGMA compile_options`).
#   -USQLITE_ENABLE_LOAD_EXTENSION -DSQLITE_OMIT_LOAD_EXTENSION
#                               no extension loading
#   -USQLITE_USE_URI            a `file:` name is not a URI
#   -DSQLITE_DEFAULT_LOOKASIDE=0,0
#                               no lookaside buffer, so freed memory is erased
#                               when cipher_memory_security is on
[env]
LIBSQLITE3_FLAGS = { value = "-USQLITE_ENABLE_LOAD_EXTENSION -DSQLITE_OMIT_LOAD_EXTENSION -USQLITE_USE_URI -DSQLITE_DEFAULT_LOOKASIDE=0,0", force = true }
