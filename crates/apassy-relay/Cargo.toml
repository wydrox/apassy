[package]
name = "apassy-relay"
version = "0.5.15"
edition = "2024"
rust-version = "1.97"
publish = false
license = "Apache-2.0"
repository = "https://github.com/wydrox/apassy"
description = "The team relay of Apassy: a team vault, a decision per run, and a reverse proxy that swaps placeholders"

[dependencies]
# The core crate of this workspace. `vault` enables the broker: analysis, packs,
# bouncer glue, placeholders and host rules.
apassy = { path = "../..", default-features = false, features = ["vault"] }
# The same pins as the core, so there is one copy of each crate.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
zeroize = "=1.9.0"
# Exactly the core version and features: libsqlite3-sys is a `links` crate.
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled-sqlcipher-vendored-openssl", "backup"] }
getrandom = "=0.4.3"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "=0.7.0"
# Token hashes.
sha2 = "=0.11.0"
# Basic auth in the swap, and binary fields on the wire (URL-safe, no padding).
base64 = "=0.23.1"
# Host-held item keys: X25519, HKDF-SHA256, AES-256-GCM. Already in the lock through rustls.
ring = "=0.17.14"
# Response heads from upstream hosts.
httparse = "=1.10.1"
# The public suffix list (compiled in): an item host that is a public suffix or a
# whole registrable domain covers subdomains that other people may own.
psl = "=2.1.238"
# The inbound HTTP/1.1 server. Plain HTTP: Cloudflare ends TLS. No features.
tiny_http = { version = "=0.12.0", path = "vendor/tiny_http", default-features = false }
# The HTTPS client of the apassy-team CLI. `rustls` = ring + webpki roots.
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }

[dev-dependencies]
# A test certificate authority for the mock upstream (the core pin).
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
tempfile = "=3.27.0"

[[bin]]
name = "apassy-relay"
path = "src/bin/apassy-relay.rs"

[[bin]]
name = "apassy-team"
path = "src/bin/apassy-team.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[target.'cfg(target_os = "macos")'.dependencies]
# Device keys in the login Keychain. The file store is used for all tests.
security-framework = "=3.7.0"
