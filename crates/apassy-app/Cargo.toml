[package]
name = "apassy-app"
version = "0.5.19"
edition = "2024"
rust-version = "1.97"
publish = false
license = "Apache-2.0"
repository = "https://github.com/wydrox/apassy"
description = "The Apassy desktop, interactive owner command line, and node on macOS and Linux"

[features]
# The desktop vault package uses the defaults on macOS and Linux. The separate
# Linux node package keeps `--no-default-features --features node`; add `owner` for
# interactive vault operations without eframe or a graphical session.
default = ["window", "node", "owner"]
# Interactive terminal vault operations, also available without a window.
owner = ["apassy/vault"]
window = ["apassy/desktop", "dep:eframe", "dep:tracing"]
# The node commands (`serve`, `up`, `pair`, `status`, `doctor`, `team`), in the relay
# crate (`apassy_relay::node`). Always on; the feature names the Linux build.
node = []

[dependencies]
# The core with the vault (and, with `window`, the desktop). The relay depends on the
# core, so the core cannot name the relay: this crate joins them (ADR 0037, cloud
# slice, decision 1).
apassy = { path = "../..", features = ["vault"] }
# The embedded node behind `apassy::node::backend` (crates/apassy-relay/src/embedded.rs),
# and the node commands of Linux (`apassy_relay::node`).
apassy-relay = { path = "../apassy-relay" }
eframe = { version = "=0.36.2", optional = true, default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
tracing = { version = "=0.1.44", optional = true }

[dev-dependencies]
# The unit test reads the core limit that `apassy::harden` set (src/main.rs).
rustix = { version = "=1.1.4", default-features = false, features = ["std", "process"] }
# tests/cloud_e2e.rs: the remote agent's OAuth and MCP client (ureq, as the relay tests),
# a TLS upstream with its own test root (rcgen, rustls), PKCE (ring), the key store in
# memory (zeroize), and temporary directories. The pins of the workspace: all are in
# Cargo.lock already.
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
ring = { version = "=0.17.14", default-features = false, features = ["alloc"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "=1.0.151"
tempfile = "=3.27.0"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
zeroize = "=1.9.0"
# tests/connect_tunnel.rs: the loopback Connect routes the tunnel paths to the relay's
# broker on the relay's own HTTP server, as `Relay::start` binds it (the vendored copy).
tiny_http = { version = "=0.12.0", path = "../apassy-relay/vendor/tiny_http", default-features = false }

# Another name than the root `apassy` target, so the two do not overwrite each other
# in target/. scripts/build-app.sh copies it into the bundle as Contents/MacOS/apassy;
# the Linux package installs it as `apassy`.
[[bin]]
name = "apassy-app"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
